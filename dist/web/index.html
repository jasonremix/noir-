<style>
:root{
  --void:#050203; --blood:#6f0810; --ember:#d6111c; --flare:#ff4b4b;
  --ash:#8d7f81;  --bone:#ece4e2;
  --display:'Cormorant Garamond',Didot,'Bodoni 72','Playfair Display',Georgia,serif;
  --utility:'Jost',Futura,'Avenir Next','Helvetica Neue',Arial,sans-serif;
  --gut:clamp(1.4rem,5vw,5rem);
  --line:1px solid rgba(236,228,226,.10);
  --bar:6.5vh;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{background:var(--void);-webkit-text-size-adjust:100%}
body{
  background:var(--void); color:var(--bone);
  font-family:var(--display); font-weight:300;
  font-size:clamp(1rem,.92rem + .35vw,1.16rem); line-height:1.62;
  overflow-x:hidden; overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
body.lock{overflow:hidden}
img{max-width:100%;height:auto;display:block}
a{color:inherit}
:focus-visible{outline:1px solid var(--ember);outline-offset:4px}
button:focus-visible,a:focus-visible,input:focus-visible{outline:1px solid var(--ember);outline-offset:4px}

/* ---------- typography atoms ---------- */
.lbl{
  font-family:var(--utility); font-weight:400; text-transform:uppercase;
  letter-spacing:.42em; font-size:clamp(.5rem,.46rem + .18vw,.62rem);
  color:var(--ash); margin:0 0 1.5em;
}
.lbl--em{color:var(--ember)}
.h1{
  font-family:var(--display); font-weight:300; line-height:.94;
  font-size:clamp(3.4rem,1.4rem + 11vw,11rem); margin:0;
  letter-spacing:-.012em;
}
.h2{
  font-family:var(--display); font-weight:300; line-height:1.02;
  font-size:clamp(2.1rem,1.1rem + 4.6vw,4.6rem); margin:0 0 .55em;
  letter-spacing:-.008em;
}
.h3{
  font-family:var(--display); font-weight:300; line-height:1.1;
  font-size:clamp(1.5rem,1.05rem + 1.9vw,2.5rem); margin:0;
}
.bd{font-size:clamp(1rem,.94rem + .34vw,1.24rem); color:rgba(236,228,226,.78); margin:0 0 1.1em; max-width:34ch}
.bd em{font-style:italic; color:var(--bone)}
.mut{color:var(--ash)}
.tny{
  font-family:var(--utility); text-transform:uppercase; letter-spacing:.34em;
  font-size:clamp(.5rem,.47rem + .12vw,.6rem); color:var(--ash);
}

/* ---------- persistent chrome ---------- */
.skip{
  position:fixed; left:0; top:0; z-index:99; transform:translateY(-120%);
  background:var(--void); color:var(--bone); padding:.9rem 1.2rem;
  border:var(--line); font-family:var(--utility); font-size:.62rem;
  letter-spacing:.3em; text-transform:uppercase; text-decoration:none;
}
.skip:focus{transform:none}

#gl{position:fixed; inset:0; width:100%; height:100%; z-index:0; display:block; background:var(--void)}
html:not(.gl) #gl{display:none}

.grain{
  position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.5;
  background:radial-gradient(120% 90% at 50% 55%,rgba(111,8,16,.10),transparent 62%);
}
html.gl .grain{opacity:.28}

.hdr{
  position:fixed; inset:0 0 auto 0; z-index:40; display:flex; align-items:center;
  justify-content:space-between; gap:1rem;
  padding:clamp(.9rem,2.2vh,1.5rem) var(--gut);
  pointer-events:none;
}
.hdr>*{pointer-events:auto}
.brand{display:flex; align-items:baseline; gap:.85rem; text-decoration:none}
.brand b{
  font-family:var(--display); font-weight:400; font-size:clamp(.95rem,1.9vw,1.3rem);
  letter-spacing:.36em; text-indent:.36em;
}
.brand span{
  font-family:var(--utility); text-transform:uppercase; letter-spacing:.34em;
  font-size:.5rem; color:var(--ash);
}
@media (max-width:620px){.brand span{display:none}}
.tools{display:flex; align-items:center; gap:.4rem}
.tb{
  appearance:none; background:none; border:var(--line); color:var(--ash);
  font-family:var(--utility); text-transform:uppercase; letter-spacing:.3em;
  font-size:.5rem; padding:.55em .9em .5em 1.2em; cursor:pointer;
  transition:color .3s,border-color .3s,background .3s;
}
.tb:hover{color:var(--bone); border-color:rgba(236,228,226,.26)}
.tb[aria-pressed="true"]{color:var(--flare); border-color:rgba(214,17,28,.5); background:rgba(111,8,16,.14)}
.langs{display:flex; border:var(--line)}
.langs .tb{border:0; border-left:var(--line); padding:.55em .7em .5em .9em}
.langs .tb:first-child{border-left:0}
@media (max-width:520px){.tb--m{display:none}}

.bars{position:fixed; inset:0; z-index:35; pointer-events:none}
.bars i{
  position:absolute; left:0; right:0; height:var(--bar); background:#000;
  transform:scaleY(var(--scope,0)); will-change:transform;
}
.bars i:first-child{top:0; transform-origin:top}
.bars i:last-child{bottom:0; transform-origin:bottom}

.hud{
  position:fixed; left:var(--gut); bottom:clamp(1rem,3vh,2rem); z-index:40;
  display:flex; align-items:center; gap:.75rem; pointer-events:none;
  opacity:0; transition:opacity .6s;
}
html.gl .hud{opacity:1}
.hud .rail{width:clamp(52px,9vw,120px); height:1px; background:rgba(236,228,226,.14); position:relative}
.hud .rail i{position:absolute; inset:0 auto 0 0; width:calc(var(--depth,0) * 100%); background:var(--ember)}
.hud b{font-family:var(--utility); font-weight:400; font-size:.5rem; letter-spacing:.3em; color:var(--ash); text-transform:uppercase}
.hud u{font-family:var(--utility); font-weight:400; font-size:.5rem; letter-spacing:.24em; color:var(--flare); text-decoration:none; font-variant-numeric:tabular-nums}

.rail-ch{
  position:fixed; right:var(--gut); top:50%; transform:translateY(-50%); z-index:40;
  display:flex; flex-direction:column; gap:.85rem; align-items:flex-end;
}
@media (max-width:900px){.rail-ch{display:none}}
.rail-ch button{
  appearance:none; background:none; border:0; padding:.2rem 0 .2rem .6rem; cursor:pointer;
  display:flex; align-items:center; gap:.7rem; color:var(--ash);
  font-family:var(--utility); text-transform:uppercase; letter-spacing:.3em; font-size:.5rem;
  transition:color .35s;
}
.rail-ch button i{display:block; width:14px; height:1px; background:currentColor; opacity:.45; transition:width .35s,opacity .35s}
.rail-ch button em{font-style:normal; opacity:.75}
@media (max-width:1339px){.rail-ch button em{display:none}}
.rail-ch button[aria-current="true"]{color:var(--flare)}
.rail-ch button[aria-current="true"] i{width:26px; opacity:1}
.rail-ch button:hover{color:var(--bone)}

.jump{
  position:fixed; right:var(--gut); bottom:clamp(1rem,3vh,2rem); z-index:41;
  font-family:var(--utility); text-transform:uppercase; letter-spacing:.3em; font-size:.5rem;
  color:var(--bone); background:rgba(5,2,3,.55); border:var(--line);
  padding:.85em 1.3em .8em 1.6em; cursor:pointer; text-decoration:none;
  opacity:0; transform:translateY(8px); pointer-events:none;
  transition:opacity .5s,transform .5s,border-color .3s,color .3s;
  -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
}
.jump.on{opacity:1; transform:none; pointer-events:auto}
.jump:hover{color:var(--flare); border-color:rgba(214,17,28,.45)}
@media (max-width:900px){
  .jump{right:auto; left:50%; bottom:calc(clamp(1rem,3vh,2rem) + 2.8rem); transform:translateX(-50%) translateY(8px)}
  .jump.on{transform:translateX(-50%)}
}

/* ---------- acts ---------- */
main{position:relative; z-index:2}
.act{position:relative; height:300vh}
.stage{
  position:sticky; top:0; height:100svh; height:100vh;
  display:flex; align-items:center; overflow:hidden;
}
@supports (height:100svh){.stage{height:100svh}}
.wrap{
  position:relative; width:100%; height:100%;
  padding:calc(var(--bar) + 4.5rem) var(--gut) calc(var(--bar) + 4.5rem);
  display:flex; align-items:center;
}
.blk{position:relative; z-index:2; width:min(38rem,100%)}
.blk--l{margin-right:auto}
.blk--r{margin-left:auto; text-align:right}
.blk--r .bd,.blk--r .lbl{margin-left:auto}
.blk--c{margin:0 auto; text-align:center}
@media (min-width:901px){ .blk--r{padding-right:clamp(9rem,12vw,13rem)} }
.blk--c .bd{margin-left:auto;margin-right:auto}
@media (max-width:760px){
  .blk{width:100%}
  .blk--r{text-align:left}
  .blk--r .bd,.blk--r .lbl{margin-left:0}
}
.veil{position:absolute; inset:0; z-index:1; pointer-events:none}
.veil--l{background:linear-gradient(100deg,rgba(5,2,3,.94) 0%,rgba(5,2,3,.78) 26%,rgba(5,2,3,.30) 52%,transparent 72%)}
.veil--r{background:linear-gradient(260deg,rgba(5,2,3,.94) 0%,rgba(5,2,3,.78) 26%,rgba(5,2,3,.30) 52%,transparent 72%)}
.veil--c{background:radial-gradient(78% 62% at 50% 50%,rgba(5,2,3,.90) 0%,rgba(5,2,3,.68) 44%,transparent 78%)}
.ch{display:inline-block; will-change:transform,opacity}
.w{display:inline-block; white-space:nowrap}
</style>
<style>
/* ---------- act I ---------- */
#a1 .cue{
  position:absolute; left:50%; bottom:clamp(4.5rem,11vh,7rem); transform:translateX(-50%);
  display:flex; flex-direction:column; align-items:center; gap:.9rem; z-index:2;
  opacity:calc(1 - clamp(0,var(--p,0) * 3.4,1));
}
#a1 .cue i{display:block; width:1px; height:clamp(30px,6vh,54px); background:linear-gradient(180deg,var(--ember),transparent)}
#a1 .h1{opacity:clamp(0,calc((var(--p,0) - .04) * 5),1)}

/* ---------- act III : countdown ---------- */
.mark{width:min(30rem,72vw); margin:0 auto clamp(1.6rem,4vh,2.8rem); opacity:.96}
html.gl .mark{opacity:calc(1 - clamp(0,calc((var(--p,0) - .10) * 4),1))}
.cd{display:flex; justify-content:center; gap:clamp(1.1rem,4vw,2.6rem)}
.cd div{display:flex; flex-direction:column; align-items:center; gap:.6rem; min-width:3.2em}
.cd b{
  font-family:var(--display); font-weight:300; font-variant-numeric:tabular-nums;
  font-size:clamp(2rem,1.1rem + 4vw,3.9rem); line-height:1; color:var(--bone);
}
.cd span{font-family:var(--utility); text-transform:uppercase; letter-spacing:.3em; font-size:.5rem; color:var(--ash)}
.date{
  margin-top:clamp(1.4rem,3.5vh,2.4rem); font-family:var(--display); font-weight:300;
  font-size:clamp(1.6rem,1rem + 2.4vw,2.6rem); letter-spacing:.3em; text-indent:.3em; color:var(--ember);
}

/* ---------- act IV : notes ---------- */
.notes{display:flex; flex-direction:column; gap:clamp(1.3rem,3.2vh,2.4rem)}
.note{border-top:var(--line); padding-top:clamp(.8rem,1.8vh,1.2rem); opacity:.34; transition:opacity .7s}
.note.on{opacity:1}
.note .tny{margin:0 0 .5em; color:var(--flare)}
.note h3{margin:0 0 .4em}
.note p{margin:0; font-size:clamp(.95rem,.9rem + .3vw,1.12rem); color:rgba(236,228,226,.72)}
.note p em{font-style:italic; color:var(--bone)}

/* ---------- act V : gallery fallback grid ---------- */
.pl{display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(.6rem,1.6vw,1.4rem); margin-top:clamp(1.2rem,3vh,2rem)}
.pl figure{margin:0; display:flex; flex-direction:column; justify-content:space-between; height:100%}
.pl{align-items:stretch}
.pl img{width:100%; mix-blend-mode:screen; border:var(--line)}
html.gl .nogl-only{display:none}
.pl figcaption{margin-top:.8em}

/* ---------- act VI : retail ---------- */
.shops{display:flex; flex-wrap:wrap; gap:.7rem; margin-top:.4rem}
.blk--r .shops{justify-content:flex-end}
.shop{
  display:flex; align-items:center; gap:.6rem; background:#efeae8; color:#161012;
  border-radius:2px; padding:.55rem .9rem; font-family:var(--utility);
  font-size:.66rem; letter-spacing:.12em; text-transform:uppercase; text-decoration:none;
}
.shop img{height:26px; width:auto}
.shop img.sq{height:30px}   /* a square mark reads smaller at equal height */
.shop.un{background:rgba(236,228,226,.07); color:var(--ash); border:var(--line)}
.shop.un s{text-decoration:none; opacity:.6}
.shop em{font-style:normal; font-size:.5rem; letter-spacing:.24em; color:var(--ember)}

/* ---------- act VII : specs ---------- */
.specs{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1px; background:rgba(236,228,226,.10); border:var(--line); margin:clamp(1.2rem,3vh,2rem) 0 1.2rem}
.specs div{background:var(--void); padding:clamp(.85rem,2vh,1.15rem) clamp(.9rem,2vw,1.2rem)}
.specs dt{font-family:var(--utility); text-transform:uppercase; letter-spacing:.3em; font-size:.5rem; color:var(--ash); margin:0 0 .7em}
.specs dd{margin:0; font-family:var(--display); font-size:clamp(1.05rem,1rem + .5vw,1.4rem)}
.lnk{
  appearance:none; background:none; border:0; padding:0; cursor:pointer;
  font-family:var(--utility); text-transform:uppercase; letter-spacing:.3em; font-size:.5rem;
  color:var(--ash); border-bottom:1px solid rgba(236,228,226,.22); padding-bottom:.4em;
  transition:color .3s,border-color .3s;
}
.lnk:hover{color:var(--flare); border-color:rgba(214,17,28,.5)}

/* ---------- act VIII : purchase ---------- */
.deal{
  display:inline-block; font-family:var(--utility); text-transform:uppercase;
  letter-spacing:.3em; font-size:.5rem; color:var(--flare);
  border:1px solid rgba(214,17,28,.42); padding:.6em 1em .55em 1.3em; margin-bottom:1.4rem;
}
.price{display:flex; align-items:baseline; justify-content:center; gap:.8rem; flex-wrap:wrap}
.price b{font-family:var(--display); font-weight:300; font-size:clamp(2.6rem,1.4rem + 5vw,5rem); line-height:1}
.price s{font-family:var(--display); font-size:clamp(1.1rem,1rem + 1vw,1.7rem); color:var(--ash); text-decoration-thickness:1px}
.price i{font-style:normal; font-family:var(--utility); font-size:.6rem; letter-spacing:.3em; text-transform:uppercase; color:var(--ash)}
.fine{margin:.9rem 0 0; font-family:var(--utility); font-size:.56rem; letter-spacing:.2em; text-transform:uppercase; color:var(--ash); line-height:2}
.buy{
  appearance:none; display:inline-block; margin:clamp(1.6rem,4vh,2.6rem) 0 0;
  background:var(--ember); color:#fff; border:1px solid var(--ember);
  font-family:var(--utility); text-transform:uppercase; letter-spacing:.34em; font-size:.62rem;
  padding:1.15em 2.4em 1.1em 2.74em; cursor:pointer; text-decoration:none;
  transition:background .3s,color .3s,opacity .3s;
}
.buy:hover{background:transparent; color:var(--flare)}
.buy[disabled],.buy[aria-disabled="true"]{background:transparent; color:var(--ash); border-color:rgba(236,228,226,.18); cursor:not-allowed}
.nl{margin:clamp(2rem,5vh,3.2rem) auto 0; max-width:26rem}
.nlrow{display:flex; border:var(--line)}
.nl input{
  flex:1 1 auto; min-width:0; appearance:none; background:transparent; border:0; color:var(--bone);
  font-family:var(--utility); font-size:.72rem; letter-spacing:.14em; padding:1em 1.1em;
}
.nl input::placeholder{color:var(--ash); letter-spacing:.2em; text-transform:uppercase; font-size:.6rem}
.nl button{
  appearance:none; background:rgba(236,228,226,.05); border:0; border-left:var(--line); color:var(--bone);
  font-family:var(--utility); text-transform:uppercase; letter-spacing:.3em; font-size:.54rem;
  padding:1em 1.4em 1em 1.7em; cursor:pointer; white-space:nowrap; transition:background .3s,color .3s;
}
.nl button:hover{background:rgba(214,17,28,.16); color:var(--flare)}
.nlmsg{min-height:1.4em; margin:.9rem 0 0; font-family:var(--utility); font-size:.58rem; letter-spacing:.16em; line-height:1.9; color:var(--ash)}
.nlmsg.err{color:var(--flare)}
.nlmsg.ok{color:var(--bone)}
.consent{margin:1rem 0 0; font-family:var(--utility); font-size:.52rem; letter-spacing:.14em; line-height:2; color:rgba(141,127,129,.85)}
.consent button{
  appearance:none;background:none;border:0;padding:0;cursor:pointer;color:var(--ash);
  font:inherit;border-bottom:1px solid rgba(236,228,226,.24)
}

/* ---------- footer ---------- */
.ftr{
  position:relative; z-index:2; background:var(--void); border-top:var(--line);
  padding:clamp(2.4rem,7vh,4.5rem) var(--gut) clamp(3rem,8vh,5rem);
  display:flex; flex-wrap:wrap; gap:1.4rem 2.4rem; align-items:baseline; justify-content:space-between;
}
.ftr nav{display:flex; flex-wrap:wrap; gap:1.4rem}
.ftr button{
  appearance:none;background:none;border:0;padding:0;cursor:pointer;
  font-family:var(--utility); text-transform:uppercase; letter-spacing:.3em; font-size:.5rem; color:var(--ash);
  transition:color .3s;
}
.ftr button:hover{color:var(--bone)}

/* ---------- draft mode ---------- */
.draft{position:fixed; left:var(--gut); top:calc(clamp(.9rem,2.2vh,1.5rem) + 3.4rem); z-index:45; max-width:min(30rem,84vw)}
.draft>button{
  appearance:none; cursor:pointer; background:rgba(5,2,3,.7); border:1px solid rgba(214,17,28,.4);
  color:var(--flare); font-family:var(--utility); text-transform:uppercase; letter-spacing:.3em;
  font-size:.5rem; padding:.55em 1em .5em 1.3em;
  -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
}
.draft ol{
  display:none; margin:.6rem 0 0; padding:1rem 1.2rem 1.1rem 2.4rem; list-style:decimal;
  background:rgba(5,2,3,.94); border:var(--line); max-height:52vh; overflow:auto;
  font-family:var(--utility); font-size:.58rem; letter-spacing:.08em; line-height:2; color:var(--ash);
}
.draft.open ol{display:block}
.draft li::marker{color:rgba(214,17,28,.6)}
[data-claim]{text-decoration:underline dotted rgba(214,17,28,.75); text-underline-offset:.28em; cursor:help}
.todo{color:var(--flare); font-family:var(--utility); font-size:.86em; letter-spacing:.16em}

/* ---------- legal overlay ---------- */
.ov{position:fixed; inset:0; z-index:80; display:none}
.ov.open{display:block}
.ov .sc{position:absolute; inset:0; background:rgba(3,1,2,.86); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px)}
.ov .pan{
  position:absolute; inset:clamp(.6rem,4vh,3rem) clamp(.6rem,4vw,3rem); background:var(--void);
  border:var(--line); display:flex; flex-direction:column; overflow:hidden;
}
.ov header{display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:clamp(1rem,2.4vh,1.5rem) clamp(1rem,3vw,2rem); border-bottom:var(--line)}
.ov .tabs{display:flex; flex-wrap:wrap; gap:.2rem}
.ov .tabs button{
  appearance:none; background:none; border:0; cursor:pointer; padding:.6em .9em;
  font-family:var(--utility); text-transform:uppercase; letter-spacing:.26em; font-size:.5rem; color:var(--ash);
  border-bottom:1px solid transparent; transition:color .3s,border-color .3s;
}
.ov .tabs button[aria-selected="true"]{color:var(--flare); border-color:var(--ember)}
.ov .x{
  appearance:none; background:none; border:var(--line); color:var(--bone); cursor:pointer;
  font-family:var(--utility); font-size:.6rem; letter-spacing:.2em; padding:.5em .8em; line-height:1;

var LOCALE = { de:'de-DE', en:'en-GB', fr:'fr-FR' };
var LANG = 'de';
function T(k){ var d = DICT[LANG] || DICT.de; return (k in d) ? d[k] : (DICT.de[k] !== undefined ? DICT.de[k] : k); }

/* --------------------------------------------------------------------------
   3 · SMALL HELPERS
   -------------------------------------------------------------------------- */
var $  = function(s,r){ return (r||document).querySelector(s); };
var $$ = function(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
var HTML = document.documentElement;
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
function clamp(v,a,b){ return v < a ? a : (v > b ? b : v); }
function has(v){ return v !== null && v !== undefined && v !== '' && !(Array.isArray(v) && v.length === 0); }
function money(v){
  if (!has(v) && v !== 0) return null;
  try {
    return new Intl.NumberFormat(LOCALE[LANG] || 'de-DE',
      { style:'currency', currency: CFG.product.currency || 'EUR' }).format(v);
  } catch (e) { return v.toFixed(2) + ' ' + (CFG.product.currency || 'EUR'); }
}
function shortDate(ts){
  try { return new Date(ts).toLocaleDateString(LOCALE[LANG] || 'de-DE',
    { day:'2-digit', month:'2-digit', year:'numeric' }); }
  catch (e) { return new Date(ts).toISOString().slice(0,10); }
}
function fill(str, map){
  return String(str).replace(/\{(\w+)\}/g, function(m,k){ return (k in map) ? map[k] : m; });
}
/* A gap the page refuses to paper over. */
function gapHTML(why){
  var w = esc(why || '');
  return '<span class="todo" data-claim="' + w + '" title="' + w + '">[' + esc(T('lg.todo')) + ']</span>';
}
/* A value that is present but nobody has signed off on yet. */
function claim(v, why){
  if (!has(v)) return gapHTML(why);
  if (!CFG.draft) return esc(v);
  var w = esc(why || '');
  return '<span data-claim="' + w + '" title="' + w + '">' + esc(v) + '</span>';
}
function valOr(v, why){ return has(v) ? esc(v) : gapHTML(why); }

/* --------------------------------------------------------------------------
   4 · PRICE LOGIC
   Regular price online and in retail. A launch discount that switches itself
   off when its window closes — no code change, no forgotten banner.
   -------------------------------------------------------------------------- */
function priceState(now){
  var p = CFG.product, L = p.launch || null;
  var st = { regular:p.price, retail:p.priceRetail, price:p.price,
             active:false, percent:0, from:null, until:null, saleOpen:false };
  var rel = CFG.release ? new Date(CFG.release).getTime() : null;
  st.saleOpen = (rel === null || now >= rel);
  if (!has(p.price) && p.price !== 0) { st.price = null; return st; }
  if (L && (has(L.price) || L.price === 0)) {
    var from  = L.from  ? new Date(L.from).getTime()  : -Infinity;
    var until = L.until ? new Date(L.until).getTime() :  Infinity;
    st.from = from; st.until = until;
    if (now >= from && now <= until) {
      st.active = true; st.price = L.price; st.percent = L.percent || 0;
    }
  }
  return st;
}

function paintPrice(){
  var st = priceState(Date.now());
  var now  = $('#pNow'), was = $('#pWas'), deal = $('#deal'),
      fine = $('#pFine'), buy = $('#buy');

  if (st.price === null){
    now.textContent = T('a8.soon');
    now.style.fontSize = 'clamp(1.6rem,1rem + 2.4vw,2.6rem)';
    was.hidden = true; deal.hidden = true;
  } else {
    now.textContent = money(st.price);
    now.style.fontSize = '';
    if (st.active && has(st.regular) && st.regular > st.price){
      was.hidden = false;
      was.textContent = fill(T('a8.was'), { p: money(st.regular) });
    } else { was.hidden = true; }
    if (st.active){
      deal.hidden = false;
      deal.textContent = fill(T('a8.launch'), { v: st.percent })
        + (isFinite(st.until) ? ' · ' + fill(T('a8.ends'), { d: shortDate(st.until) }) : '');
    } else { deal.hidden = true; }
  }

  var bits = [];
  if (CFG.product.taxIncluded) bits.push(T('a8.tax'));
  if (has(CFG.product.priceRetail)) bits.push(fill(T('a8.uvp'), { p: money(CFG.product.priceRetail) }));
  if (has(CFG.product.shippingNote)) bits.push(CFG.product.shippingNote);
  fine.innerHTML = bits.join(' · ') + (has(CFG.product.shippingNote) ? '' :
    ' · ' + gapHTML('Versandkosten und Lieferzeit sind nicht hinterlegt (PAngV)'));

  var sellable = st.price !== null && st.saleOpen && has(CFG.commerce.checkoutUrl);
  buy.textContent = st.saleOpen ? T('a8.cta') : T('a8.ctaoff');
  if (sellable){
    buy.setAttribute('href', CFG.commerce.checkoutUrl);
    buy.removeAttribute('aria-disabled');
  } else {
    buy.setAttribute('href', '#a8');
    buy.setAttribute('aria-disabled', 'true');
  }
  return st;
}

/* --------------------------------------------------------------------------
   5 · STRUCTURED DATA — an offer only when there really is a price
   -------------------------------------------------------------------------- */
function paintJSONLD(){
  var st = priceState(Date.now()), p = CFG.product;
  var node = {
    '@context':'https://schema.org', '@type':'Product',
    name: p.name + ' ' + p.line,
    category:'Eau de Parfum',
    description: DICT.de['a1.label'],
    brand: { '@type':'Brand', name: p.name }
  };
  if (has(CFG.site.ogImage)) node.image = [CFG.site.ogImage];
  if (has(p.gtin)) node.gtin13 = p.gtin;
  if (has(p.sku))  node.sku = p.sku;
  if (has(p.volume)) node.size = p.volume;
  if (st.price !== null){
    var offer = {
      '@type':'Offer', price: st.price.toFixed(2), priceCurrency: p.currency,
      availability: st.saleOpen ? 'https://schema.org/InStock' : 'https://schema.org/PreOrder',
      itemCondition:'https://schema.org/NewCondition'
    };
    if (has(CFG.site.canonical)) offer.url = CFG.site.canonical;
    if (st.active && isFinite(st.until)) offer.priceValidUntil = new Date(st.until).toISOString().slice(0,10);
    if (has(p.priceRetail)){
      offer.priceSpecification = [{
        '@type':'UnitPriceSpecification', priceType:'https://schema.org/ListPrice',
        price: p.priceRetail.toFixed(2), priceCurrency: p.currency,
        valueAddedTaxIncluded: !!p.taxIncluded
      }];
    }
    node.offers = offer;
  }
  var el = $('#ld');
  if (!el){ el = document.createElement('script'); el.type = 'application/ld+json'; el.id = 'ld'; document.head.appendChild(el); }
  el.textContent = JSON.stringify(node, null, 2);
}

/* --------------------------------------------------------------------------
   6 · RETAIL — unconfirmed partners appear nowhere the customer could
   mistake for a promise. In draft mode they are listed, greyed and marked.
   -------------------------------------------------------------------------- */
function confirmedRetail(role){
  return CFG.retail.filter(function(r){ return r.role === role && r.confirmed === true; });
}
function paintRetail(){
  ['maker','shop'].forEach(function(role){
    var host = $(role === 'maker' ? '#makers' : '#shops');
    host.innerHTML = '';
    var live = confirmedRetail(role);
    var show = CFG.draft ? CFG.retail.filter(function(r){ return r.role === role; }) : live;
    show.forEach(function(r){
      var on = r.confirmed === true, tag;
      if (on && has(r.url)){ tag = document.createElement('a'); tag.href = r.url; tag.rel = 'noopener'; }
      else { tag = document.createElement('span'); }
      tag.className = 'shop' + (on ? '' : ' un');
      if (on && has(r.logo)){
        /* the mark carries the name; the alt text carries it for everyone else */
        tag.innerHTML = '<img src="' + esc(r.logo) + '" alt="' + esc(r.name) + '"' +
                        (r.mark ? ' class="sq"' : '') + ' loading="lazy" decoding="async">';
      } else if (on){
        tag.innerHTML = esc(r.name);
      } else {
        tag.innerHTML = '<s>' + esc(r.name) + '</s><em>' + esc(T('a6.unconfirmed')) + '</em>';
      }
      host.appendChild(tag);
    });
    if (role === 'shop') $('#shopsNone').hidden = live.length > 0;
  });
}

/* --------------------------------------------------------------------------
   7 · DRAFT MODE — the open-points ledger, generated from CFG
   -------------------------------------------------------------------------- */

  add(!has(p.shippingNote),       'Versandkosten und Lieferzeit nicht hinterlegt (PAngV)');
  add(!has(c.newsletterEndpoint), 'Newsletter-Endpunkt fehlt — Adressen werden nicht gespeichert');
  add(!has(p.inci),               'INCI-Liste fehlt (VO (EG) 1223/2009)');
  add(!has(p.allergens),          'Deklarationspflichtige Duftstoffe fehlen');
  add(!has(p.batch),              'Chargennummer fehlt');
  add(!has(p.pao),                'Haltbarkeit nach Öffnung (PAO) fehlt');
  add(!has(p.warnings),           'Warnhinweise fehlen');
  add(!has(p.responsible && p.responsible.name), 'Verantwortliche Person in der EU fehlt');
  add(!has(l.company) || !has(l.street) || !has(l.city), 'Impressum: Anbieter und Anschrift fehlen');
  add(!has(l.email),              'Kontakt-E-Mail fehlt (§ 5 DDG)');
  add(!has(l.vat),                'USt-IdNr. fehlt');
  add(!has(l.register) || !has(l.court), 'Registereintrag und Registergericht fehlen');
  add(!has(l.returnAddress),      'Rücksendeanschrift für den Widerruf fehlt');
  add(!has(l.privacyOfficer),     'Datenschutz: Verantwortlicher / Ansprechpartner fehlt');
  add(!has(l.hosting),            'Datenschutz: Hosting-Dienstleister nicht benannt');
  add(true,                       'Datenschutz und Widerruf sind Gerüste — anwaltlich prüfen lassen');
  add(CFG.retail.some(function(r){ return !r.confirmed; }), 'Händler nicht bestätigt — Freigabe für Nennung und Logo einholen');
  var linkless = CFG.retail.filter(function(r){ return r.confirmed && !has(r.url); });
  add(linkless.length > 0, 'Kein Ziel-Link für ' + linkless.map(function(r){ return r.name; }).join(', ') +
                           ' — die Logos sind dadurch nicht anklickbar');
  add(CFG.retail.every(function(r){ return !has(r.logo); }), 'Händlerlogos liegen nicht vor — in Originalfarben einbinden, nicht weiß einfärben');
  add(true,                       'Duftnoten sind ein Entwurf — von der Parfumeurin bestätigen lassen');
  add(true,                       'Eckdaten (' + [p.volume, p.concentration, p.wear, p.edition].join(' · ') + ') bestätigen lassen');
  add(/^__|^$/.test(String(CFG.site.canonical)), 'Canonical-URL noch nicht gesetzt');
  add(!/^https?:/.test(String(CFG.site.ogImage)), 'og:image braucht eine absolute URL');
  add(true,                       'Streichpreis nach § 11 PAngV: nach Aktionsende muss online wirklich ' +
                                  (money(p.priceRetail) || '—') + ' verlangt werden, sonst „Einführungspreis" ohne Streichpreis');
  add(true,                       'Vor dem Aktionsstart zeigt die Seite den regulären Preis — ob stattdessen der Einführungspreis angekündigt wird, ist eine Marketing-Entscheidung');
  add(true,                       'UVP-Formulierung: Händlerpreise dürfen nach § 1 GWB nicht vorgeschrieben werden');
  add(true,                       'Google Fonts und cdnjs laden von fremden Servern — vor dem Livegang selbst hosten');
  add(true,                       'Zusätzliche UI-Texte (Skip-Link, Fallback-Hinweis, Rechtsüberschriften) redaktionell prüfen');
  add(true,                       'Diese Seite wurde noch nie auf einem echten Gerät gesichtet — Kamerafahrt, Timing und Bildrate brauchen eine Justierrunde');
  return o;
}
function paintDraft(){
  var host = $('#draft');
  if (!CFG.draft){ host.hidden = true; return; }
  var pts = openPoints();
  host.hidden = false;
  $('#draftT').textContent = fill(T('draft.n'), { n: pts.length });
  $('#draftL').innerHTML = pts.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('');
}

   8 · LEGAL OVERLAY
   A scaffold of the points the law asks for. No invented legal prose —

  if (RELEASE === null) return;
  var left = Math.max(0, RELEASE - Date.now());

  var d = Math.floor(s / 86400); s -= d * 86400;
  var h = Math.floor(s / 3600);  s -= h * 3600;

/* --------------------------------------------------------------------------
   12 · CURVES — one interpolator for the flight and everything hung off it
   -------------------------------------------------------------------------- */
function smoothstep(e0, e1, x){
  if (e1 <= e0) return x < e0 ? 0 : 1;          /* edge0 < edge1, always */
  var t = clamp((x - e0) / (e1 - e0), 0, 1);
  return t * t * (3 - 2 * t);
}
/* pts = [[g,value], …] ascending in g */
function curve(pts, g){
  var n = pts.length;
  if (g <= pts[0][0]) return pts[0][1];
  if (g >= pts[n-1][0]) return pts[n-1][1];
  for (var i = 1; i < n; i++){
    if (g <= pts[i][0]){
      var a = pts[i-1], b = pts[i];
      var t = smoothstep(a[0], b[0], g);
      return a[1] + (b[1] - a[1]) * t;
    }
  }
  return pts[n-1][1];
}

/* --------------------------------------------------------------------------
   13 · SCROLL ENGINE
   Eight acts, one running variable g in [0,8]. GSAP scrubs it with a lag —
   the camera trails the scroll instead of sticking to it. Without GSAP the
   same value is measured by hand.
   -------------------------------------------------------------------------- */
var ACTS = $$('.act');
var P = ACTS.map(function(){ return { v: 0 }; });
var G = 0;
var HAS_GSAP = !!(window.gsap && window.ScrollTrigger);
var TWEENS = [];

function sumG(){
  var s = 0;
  for (var i = 0; i < P.length; i++) s += P[i].v;
  G = s;
}
function pushP(i, v){
  P[i].v = v;
  ACTS[i].style.setProperty('--p', v.toFixed(4));
  sumG();
}

function buildScrubs(){
  if (!HAS_GSAP) return;
  ACTS.forEach(function(el, i){
    var tw = gsap.to(P[i], {
      v: 1, ease: 'none',
      scrollTrigger: { trigger: el, start: 'top top', end: 'bottom bottom', scrub: 1.2 },
      onUpdate: function(){ pushP(i, P[i].v); }
    });
    TWEENS.push(tw);
  });
}

/* manual measurement — identical semantics, no library */
function measureManual(){
  var vh = window.innerHeight;
  for (var i = 0; i < ACTS.length; i++){
    var r = ACTS[i].getBoundingClientRect();
    var span = r.height - vh;
    var p = span > 0 ? clamp(-r.top / span, 0, 1) : (r.top <= 0 ? 1 : 0);
    pushP(i, p);
  }
}

/* --------------------------------------------------------------------------
   14 · REVEALS
   -------------------------------------------------------------------------- */
function splitChars(el){
  if (el.__split) return el.__chars;
  var src = el.innerHTML;
  var tmp = document.createElement('div');
  tmp.innerHTML = src;
  var out = document.createDocumentFragment();
  var chars = [];
  (function walk(node, target){
    Array.prototype.slice.call(node.childNodes).forEach(function(n){
      if (n.nodeType === 3){
        /* one wrapper per word, one span per letter: the letters animate,
           the wrapper keeps the word from breaking across two lines */
        n.nodeValue.split(/(\s+)/).forEach(function(chunk){
          if (chunk === '') return;
          if (/^\s+$/.test(chunk)){ target.appendChild(document.createTextNode(' ')); return; }
          var w = document.createElement('span');
          w.className = 'w';
          chunk.split('').forEach(function(c){
            var s = document.createElement('span');
            s.className = 'ch'; s.textContent = c;
            chars.push(s); w.appendChild(s);
          });
          target.appendChild(w);
        });
      } else if (n.nodeType === 1){
        var clone = document.createElement(n.tagName.toLowerCase());
        target.appendChild(clone);
        walk(n, clone);
      }
    });
  })(tmp, out);
  el.innerHTML = '';
  el.appendChild(out);
  el.__split = true; el.__chars = chars;
  return chars;
}
function unsplit(el){
  if (!el.__split) return;
  el.__split = false; el.__chars = null;
}

var RV = [], UP = [];
/* An act is 300vh tall but its stage is pinned for only 200vh, so a reveal
   quoted as "30% of the act" is 20% of the section. Without this the letters
   of a headline are still assembling when the act is already over. */
var STICK = 2 / 3;
function atP(p){ return 'top+=' + (p * 100 * STICK).toFixed(3) + '% top'; }
function killTweens(){
  TWEENS.forEach(function(t){
    if (t.scrollTrigger) t.scrollTrigger.kill();
    t.kill();
  });
  TWEENS.length = 0;
  if (window.gsap){
    RV.forEach(function(r){ gsap.set(r.chars, { clearProps: 'all' }); });
    UP.forEach(function(u){ gsap.set(u.el, { clearProps: 'all' }); });
  }
}
function buildReveals(){
  RV = []; UP = [];
  ACTS.forEach(function(act){
    $$('.rv', act).forEach(function(el){
      unsplit(el);
      var chars = splitChars(el);
      RV.push({ act: act, el: el, chars: chars });
    });
    $$('.up', act).forEach(function(el){ UP.push({ act: act, el: el }); });
  });

  var still = HTML.classList.contains('still');
  if (still){
    RV.forEach(function(r){ r.chars.forEach(function(c){ c.style.cssText = ''; }); });
    UP.forEach(function(u){ u.el.style.cssText = u.el.style.cssText.replace(/opacity[^;]*;?|transform[^;]*;?/g, ''); });
    return;
  }

  if (HAS_GSAP){
    RV.forEach(function(r){
      var tw = gsap.fromTo(r.chars,
        { opacity: 0, yPercent: 52, filter: 'blur(12px)' },
        { opacity: 1, yPercent: 0, filter: 'blur(0px)', ease: 'none',
          stagger: { each: 0.012, from: 'start' },
          scrollTrigger: { trigger: r.act, start: atP(0.30), end: atP(0.72), scrub: true } });
      TWEENS.push(tw);
    });
    UP.forEach(function(u){
      var tw = gsap.fromTo(u.el,
        { y: 40, opacity: 0 },
        { y: 0, opacity: 1, duration: 1.3, ease: 'power3.out',
          scrollTrigger: { trigger: u.act, start: atP(0.22), toggleActions: 'play none none reverse' } });
      TWEENS.push(tw);
    });
  }
}
function manualReveals(){
  if (HAS_GSAP || HTML.classList.contains('still')) return;
  for (var i = 0; i < ACTS.length; i++){
    var p = P[i].v;
    var rp = clamp((p - 0.15) / 0.21, 0, 1);
    for (var j = 0; j < RV.length; j++){
      if (RV[j].act !== ACTS[i]) continue;
      var cs = RV[j].chars, n = cs.length;
      for (var k = 0; k < n; k++){
        var t = clamp(rp * 1.35 - (k / Math.max(1, n)) * 0.35, 0, 1);
        var s = cs[k].style;
        s.opacity = t;
        s.transform = 'translateY(' + ((1 - t) * 52) + '%)';
        s.filter = t > 0.99 ? 'none' : 'blur(' + ((1 - t) * 12).toFixed(2) + 'px)';
      }
    }
    var up = clamp((p - 0.10) / 0.14, 0, 1);
    for (var m = 0; m < UP.length; m++){
      if (UP[m].act !== ACTS[i]) continue;
      UP[m].el.style.opacity = up;
      UP[m].el.style.transform = 'translateY(' + ((1 - up) * 40) + 'px)';
    }
  }
}
var BOOTED = false;
window.__noireReveals = function(){
  if (!BOOTED) return;            /* boot builds once, by hand, at the end */
  killTweens();
  buildReveals();
  if (HAS_GSAP){ buildScrubs(); ScrollTrigger.refresh(); }
};
