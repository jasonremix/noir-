/* ==========================================================================
   16 · THE WORLD
   Three r128 — no examples/js, so every post-processing pass below is
   hand written. All fog is manual, all light is emissive: there is exactly
   one lamp in this world and it is red.
   ========================================================================== */
var GL = null;

/* one vertex shader for every surface in the corridor */
var VERT = [
'varying vec3 vW;',
'varying vec2 vUv;',
'varying vec3 vN;',
'varying vec3 vL;',
'varying float vD;',
'void main(){',
'  vUv = uv;',
'  vL  = position;',
'  vec4 wp = modelMatrix * vec4(position, 1.0);',
'  vW = wp.xyz;',
'  vN = normalize(mat3(modelMatrix) * normal);',
'  vec4 mv = modelViewMatrix * vec4(position, 1.0);',
'  vD = -mv.z;',
'  gl_Position = projectionMatrix * mv;',
'}'
].join('\n');

var FOG_FN = [
'float fogAmt(float d, float k){ float t = k * d; return exp(-t * t); }'
].join('\n');

/* ---- floor, walls, ceiling ------------------------------------------- */
var F_SURFACE = [
'precision highp float;',
'uniform vec3 uCol; uniform vec3 uGlow;',
'uniform float uTime; uniform float uFog; uniform float uInt;',
'varying vec3 vW; varying float vD;',
FOG_FN,
'void main(){',
'  float seam = abs(fract(vW.z / 4.5) - 0.5);',
'  float rib  = 1.0 - smoothstep(0.0, 0.055, seam);',
'  float lowGlow  = exp(-max(0.0, vW.y + 2.7) * 0.85);',
'  float highGlow = exp(-max(0.0, 2.7 - vW.y) * 1.6) * 0.35;',
'  float pulse = fract((-vW.z + uTime * 14.0) / 46.0);',
'  float px = (pulse - 0.5) * 46.0;',
'  float band = exp(-px * px * 0.010) * 0.55;',
'  vec3 col = uCol * (0.10 + rib * 0.9)',
'           + uGlow * (lowGlow * 0.55 + highGlow)',
'           + uGlow * band * (0.35 + rib * 1.2);',
'  col *= uInt;',
'  col *= fogAmt(vD, uFog);',
'  gl_FragColor = vec4(col, 1.0);',
'}'
].join('\n');

/* ---- the 42 light rings and the portal -------------------------------- */
var F_RING = [
'precision highp float;',
'uniform vec3 uCol; uniform float uTime; uniform float uFog; uniform float uInt;',
'varying vec3 vW; varying float vD;',
FOG_FN,
'void main(){',
'  float pulse = fract((-vW.z + uTime * 26.0) / 60.0);',
'  float px = (pulse - 0.5) * 60.0;',
'  float wave = exp(-px * px * 0.010);',
'  float a = (0.30 + wave * 1.7) * uInt;',
'  vec3 col = uCol * a * fogAmt(vD, uFog);',
'  gl_FragColor = vec4(col, 1.0);',
'}'
].join('\n');

/* ---- the four full length light strips -------------------------------- */
var F_STRIP = [
'precision highp float;',
'uniform vec3 uCol; uniform float uTime; uniform float uFog; uniform float uInt;',
'varying vec2 vUv; varying vec3 vW; varying float vD;',
FOG_FN,
'void main(){',
'  float y = (vUv.y - 0.5) * 2.0;',
'  float core = exp(-y * y * 26.0);',
'  float pulse = fract((-vW.z + uTime * 20.0) / 52.0);',
'  float px = (pulse - 0.5) * 52.0;',
'  float wave = exp(-px * px * 0.012);',
'  vec3 col = uCol * core * (0.55 + wave * 1.5) * uInt * fogAmt(vD, uFog);',
'  gl_FragColor = vec4(col, 1.0);',
'}'
].join('\n');

/* ---- poster / plaque frames: edge only -------------------------------- */
var F_FRAME = [
'precision highp float;',
'uniform vec3 uCol; uniform float uFog; uniform float uInt;',
'varying vec2 vUv; varying float vD;',
FOG_FN,
'void main(){',
'  float e = min(min(vUv.x, 1.0 - vUv.x), min(vUv.y, 1.0 - vUv.y));',
'  float a = (1.0 - smoothstep(0.004, 0.03, e)) + exp(-e * 14.0) * 0.22;',
'  vec3 col = uCol * a * uInt * fogAmt(vD, uFog);',
'  gl_FragColor = vec4(col, 1.0);',
'}'
].join('\n');

/* ---- anything with a picture on it: posters, plaques, the wordmark ----- */
var F_ART = [
'precision highp float;',
'uniform sampler2D uMap; uniform float uFog; uniform float uInt; uniform vec3 uTint;',
'varying vec2 vUv; varying float vD;',
FOG_FN,
'void main(){',
'  vec4 t = texture2D(uMap, vUv);',
'  vec3 col = t.rgb * t.a * uTint * uInt * fogAmt(vD, uFog);',
'  gl_FragColor = vec4(col, 1.0);',
'}'
].join('\n');

/* ---- retailer logos: original colours on a light plate, never additive -- */
var F_LOGO = [
'precision highp float;',
'uniform sampler2D uMap; uniform float uFog; uniform float uInt;',
'varying vec2 vUv; varying float vD;',
FOG_FN,
'void main(){',
'  vec4 t = texture2D(uMap, vUv);',
'  vec3 col = t.rgb * uInt * fogAmt(vD, uFog);',
'  gl_FragColor = vec4(col, t.a);',
'}'
].join('\n');

/* ---- the flacon: black glass, one red edge ---------------------------- */
var F_GLASS = [
'precision highp float;',
'uniform vec3 uColA; uniform vec3 uColB;',
'uniform float uRim; uniform float uGlass; uniform float uFog; uniform float uFade;',
'uniform vec3 uLKey; uniform vec3 uLFill;',
'varying vec3 vW; varying vec3 vN; varying float vD;',
FOG_FN,
'vec3 envSample(vec3 d){',
'  float floorish = 1.0 - smoothstep(-0.55, 0.0, d.y);',
'  vec3 c = uColA * (exp(-abs(d.y) * 4.5) * 0.34 + floorish * 0.30);',
'  c += uColB * 0.05;',
'  float lamp = pow(max(dot(normalize(vec3(0.0, 0.12, -1.0)), d), 0.0), 24.0);',
'  c += vec3(1.0, 0.52, 0.48) * lamp * 1.5;',
'  return c;',
'}',
'void main(){',
'  vec3 N = normalize(vN);',
'  vec3 V = normalize(cameraPosition - vW);',
'  if (dot(N, V) < 0.0) N = -N;',
'  float fres = pow(1.0 - clamp(dot(N, V), 0.0, 1.0), 3.2);',
'  float rimA = pow(max(dot(N, uLKey),  0.0), 1.7) * fres;',
'  float rimB = pow(max(dot(N, uLFill), 0.0), 2.2) * fres;',
'  float spec = pow(max(dot(N, normalize(uLKey + V)), 0.0), 120.0);',
'  vec3 reflDir = reflect(-V, N);',
'  vec3 refrDir = refract(-V, N, 0.665);',
'  if (dot(refrDir, refrDir) < 0.0001) refrDir = reflDir;',   /* total internal reflection */
'  vec3 col = uColA * rimA * uRim',
'           + uColB * rimB * uRim * 0.9',
'           + uColA * spec * 2.4',
'           + envSample(refrDir) * (1.0 - fres) * 0.55 * uGlass',
'           + envSample(reflDir) * fres * 0.85 * uGlass;',
'  float mirror = mix(1.0, smoothstep(-13.5, -2.7, vW.y) * 0.32, uFade);',
'  col *= mirror;',
'  col *= fogAmt(vD, uFog);',
'  gl_FragColor = vec4(col, 1.0);',
'}'
].join('\n');

/* ---- what is inside the bottle ---------------------------------------- */
var F_LIQUID = [
'precision highp float;',
'uniform vec3 uCol; uniform float uFill; uniform float uInt; uniform float uFog; uniform float uFade;',
'varying vec3 vL; varying vec3 vN; varying vec3 vW; varying float vD;',
FOG_FN,
'void main(){',
'  vec3 N = normalize(vN);',
'  vec3 V = normalize(cameraPosition - vW);',
'  float fres = pow(1.0 - clamp(abs(dot(N, V)), 0.0, 1.0), 3.0);',
'  float surface  = 1.0 - smoothstep(uFill - 0.02, uFill + 0.03, vL.y);',
'  float meniscus = exp(-abs(vL.y - uFill) * 42.0) * 0.9;',
'  float depth    = clamp((uFill - vL.y) * 0.9 + 0.25, 0.0, 1.0);',
'  float a = (depth * 0.5 + fres * 0.28 + meniscus) * surface * uInt;',
'  float mirror = mix(1.0, smoothstep(-13.5, -2.7, vW.y) * 0.32, uFade);',
'  vec3 col = uCol * a * mirror * fogAmt(vD, uFog);',
'  gl_FragColor = vec4(col, 1.0);',
'}'
].join('\n');

/* ---- the shaft of light behind the flacon ----------------------------- */
var F_COLUMN = [
'precision highp float;',
'uniform vec3 uCol; uniform float uTime; uniform float uInt; uniform float uFog;',
'varying vec2 vUv; varying float vD;',
FOG_FN,
'void main(){',
'  float x = (vUv.x - 0.5) * 2.0;',
'  float core = exp(-x * x * 700.0);',
'  float halo = exp(-x * x * 22.0) * 0.3;',
'  float glow = exp(-x * x * 3.0) * 0.08;',
'  float fall = smoothstep(0.0, 0.22, vUv.y) * (1.0 - smoothstep(0.62, 1.0, vUv.y));',
'  float flick = 0.93 + 0.07 * sin(uTime * 2.3 + vUv.y * 9.0) * sin(uTime * 0.7);',
'  vec3 col = uCol * (core + halo + glow) * fall * flick * uInt * fogAmt(vD, uFog);',
'  gl_FragColor = vec4(col, 1.0);',
'}'
].join('\n');

/* ---- the pool of light it stands in ----------------------------------- */
var F_POOL = [
'precision highp float;',
'uniform vec3 uCol; uniform float uInt; uniform float uFog; uniform float uTime;',
'varying vec2 vUv; varying float vD;',
FOG_FN,
'void main(){',
'  vec2 d = vUv - 0.5;',
'  float r = length(d) * 2.0;',
'  float a = exp(-r * r * 7.0) * 0.9 + exp(-r * r * 1.6) * 0.16;',
'  float breathe = 0.92 + 0.08 * sin(uTime * 0.6);',
'  vec3 col = uCol * a * breathe * uInt * fogAmt(vD, uFog);',
'  gl_FragColor = vec4(col, 1.0);',
'}'
].join('\n');

/* ---- dust ------------------------------------------------------------- */
var V_DUST = [
'uniform float uSize; uniform float uPix;',
'attribute float aSeed;',
'varying float vD; varying float vSeed;',
'void main(){',
'  vSeed = aSeed;',
'  vec4 mv = modelViewMatrix * vec4(position, 1.0);',
'  vD = -mv.z;',
'  gl_PointSize = uSize * uPix * (34.0 / max(1.0, vD));',
'  gl_Position = projectionMatrix * mv;',
'}'
].join('\n');
var F_DUST = [
'precision highp float;',
'uniform vec3 uCol; uniform float uFog; uniform float uInt;',
'varying float vD; varying float vSeed;',
FOG_FN,
'void main(){',
'  vec2 c = gl_PointCoord - 0.5;',
'  float r = dot(c, c) * 4.0;',
'  float a = exp(-r * 5.0);',
'  vec3 col = uCol * a * uInt * (0.35 + vSeed * 0.9) * fogAmt(vD, uFog);',
'  gl_FragColor = vec4(col, 1.0);',
'}'
].join('\n');

/* --------------------------------------------------------------------------
   17 · WORLD CONSTANTS
   -------------------------------------------------------------------------- */
var CW = 3.6, CH = 2.7;                    /* corridor half width / half height */
var Z0 = 24, Z1 = -150;                    /* corridor from / to               */
var CORLEN = Z0 - Z1;                      /* 174                              */
var HALL_END = -196, FLOOR_Y = -2.7;
var FLACON_Z = -178, FLACON_S = 3.7;
var FOG = 0.0135;
var RING_N = 42, RING_GAP = CORLEN / RING_N;

/* Result of the tuning pass on real hardware. Every formula in the brief is
   untouched — these are the intensity knobs it leaves to the build. Without
   them the soft highlight roll-off in the composite is driven so hard that
   saturated red climbs past its asymptote and the flacon turns milky white
   instead of black lacquer with one red edge. */
var EX = {
  wall: 0.52, ceil: 0.55, ring: 0.46, strip: 0.40, frame: 0.55,
  glass: 0.15, rim: 1.75, liquid: 0.22, column: 0.42, pool: 0.34, dust: 0.55,
  bloom: 0.46, flare: 0.50, art: 0.85
};

/* Built only once three is on the page — without it the fallback must
   still come up, so nothing here may touch THREE at parse time. */
var COL_HEX = { void:'#050203', blood:'#6f0810', ember:'#d6111c',
                flare:'#ff4b4b', rose:'#ff2f52', deep:'#8e0510' };
var COL = null;
function initColours(){
  if (COL) return COL;
  COL = {};
  for (var k in COL_HEX) COL[k] = new THREE.Color(COL_HEX[k]);
  return COL;
}

/* the whole world takes its light colour from the fragrance pyramid */
function worldColour(g, out){
  var a, b, t;
  if (g < 3.05)      { a = COL.ember; b = COL.ember; t = 0; }
  else if (g < 3.45) { a = COL.ember; b = COL.flare; t = smoothstep(3.05, 3.45, g); }
  else if (g < 3.80) { a = COL.flare; b = COL.rose;  t = smoothstep(3.45, 3.80, g); }
  else if (g < 4.40) { a = COL.rose;  b = COL.deep;  t = smoothstep(3.80, 4.40, g); }
  else               { a = COL.deep;  b = COL.ember; t = smoothstep(4.40, 5.20, g); }
  out.copy(a).lerp(b, t);
  return out;
}

function detectWebGL(){
  try {
    var c = document.createElement('canvas');
    return !!(window.WebGLRenderingContext &&
      (c.getContext('webgl') || c.getContext('experimental-webgl')));
  } catch (e) { return false; }
}

/* --------------------------------------------------------------------------
   18 · SCENE
   -------------------------------------------------------------------------- */
function buildWorld(){
  initColours();
  var W = {};
  var scene = W.scene = new THREE.Scene();
  var lightCol = new THREE.Color().copy(COL.ember);
  W.lightCol = lightCol;
  W.wallMats = []; W.ringMats = []; W.artMats = []; W.frameMats = [];
  W.wallMounted = [];
  W.canvasTex = [];

  function mat(frag, uni, opts){
    opts = opts || {};
    var m = new THREE.ShaderMaterial({
      vertexShader: opts.vert || VERT,
      fragmentShader: frag,
      uniforms: uni,
      transparent: !!opts.additive,
      blending: opts.additive ? THREE.AdditiveBlending : THREE.NormalBlending,
      depthWrite: opts.additive ? false : (opts.depthWrite !== false),
      depthTest: opts.depthTest !== false,
      side: opts.side || THREE.FrontSide,
      fog: false
    });
    if (opts.order !== undefined) m.__order = opts.order;
    return m;
  }
  W.mat = mat;

  /* ---- 1 · floor, walls, ceiling ------------------------------------- */
  function surfaceMat(int){
    var m = mat(F_SURFACE, {
      uCol:  { value: new THREE.Color().copy(COL.blood) },
      uGlow: { value: lightCol },
      uTime: { value: 0 }, uFog: { value: FOG }, uInt: { value: int }
    }, { side: THREE.DoubleSide });
    m.__baseInt = int;
    W.wallMats.push(m);
    return m;
  }
  var floorMat = surfaceMat(EX.wall);
  var floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 240, 1, 96), floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.position.set(0, FLOOR_Y, (Z0 + HALL_END) / 2);
  scene.add(floor);

  var wallGeo = new THREE.PlaneGeometry(CORLEN, CH * 2, 96, 1);
  var wallL = new THREE.Mesh(wallGeo, surfaceMat(EX.wall));
  wallL.position.set(-CW, 0, Z1 + CORLEN / 2); wallL.rotation.y = Math.PI / 2;
  scene.add(wallL);
  var wallR = new THREE.Mesh(wallGeo, surfaceMat(EX.wall));
  wallR.position.set(CW, 0, Z1 + CORLEN / 2); wallR.rotation.y = -Math.PI / 2;
  scene.add(wallR);

  var ceil = new THREE.Mesh(new THREE.PlaneGeometry(CW * 2, CORLEN, 1, 96), surfaceMat(EX.wall * EX.ceil));
  ceil.rotation.x = Math.PI / 2;
  ceil.position.set(0, CH, Z1 + CORLEN / 2);
  scene.add(ceil);

  /* ---- 2 · 42 light rings, one material for all of them ---------------- */
  function ringGeo(t){
    var s = new THREE.Shape();
    s.moveTo(-CW, -CH); s.lineTo(CW, -CH); s.lineTo(CW, CH); s.lineTo(-CW, CH); s.closePath();
    var h = new THREE.Path();
    h.moveTo(-CW + t, -CH + t); h.lineTo(-CW + t, CH - t);
    h.lineTo(CW - t, CH - t);   h.lineTo(CW - t, -CH + t); h.closePath();
    s.holes.push(h);
    return new THREE.ShapeGeometry(s);
  }
  var rGeo = ringGeo(0.17);
  var ringMat = mat(F_RING, {
    uCol: { value: lightCol }, uTime: { value: 0 },
    uFog: { value: FOG }, uInt: { value: 1 }
  }, { additive: true, side: THREE.DoubleSide });
  W.ringMats.push(ringMat);
  W.rings = [];
  for (var i = 0; i < RING_N; i++){
    var r = new THREE.Mesh(rGeo, ringMat);
    r.position.z = Z0 - (i + 0.5) * RING_GAP;
    r.renderOrder = 2;
    scene.add(r); W.rings.push(r);
  }

  /* ---- 3 · the portal ------------------------------------------------- */
  var portalMat = mat(F_RING, {
    uCol: { value: lightCol }, uTime: { value: 0 },
    uFog: { value: FOG * 0.55 }, uInt: { value: 1.6 }
  }, { additive: true, side: THREE.DoubleSide });
  W.portalMat = portalMat;
  var portal = new THREE.Mesh(rGeo, portalMat);
  portal.position.z = Z1; portal.scale.set(1.24, 1.24, 1); portal.renderOrder = 3;
  scene.add(portal);

  /* ---- 4 · four light strips over the full length ---------------------- */
  var stripMat = mat(F_STRIP, {
    uCol: { value: lightCol }, uTime: { value: 0 },
    uFog: { value: FOG }, uInt: { value: 1 }
  }, { additive: true, side: THREE.DoubleSide });
  W.stripMat = stripMat;
  var stripGeo = new THREE.PlaneGeometry(CORLEN, 0.5, 64, 1);
  [[-1, -CH + 0.16], [-1, CH - 0.16], [1, -CH + 0.16], [1, CH - 0.16]].forEach(function(p){
    var s = new THREE.Mesh(stripGeo, stripMat);
    s.position.set(p[0] * (CW - 0.05), p[1], Z1 + CORLEN / 2);
    s.rotation.y = p[0] < 0 ? Math.PI / 2 : -Math.PI / 2;
    s.renderOrder = 2;
    scene.add(s);
  });

  /* ---- 5 · nine light shafts across the corridor ----------------------- */
  var shaftGeo = new THREE.PlaneGeometry(CW * 2.1, 0.34, 8, 1);
  for (var s9 = 0; s9 < 9; s9++){
    var sh = new THREE.Mesh(shaftGeo, stripMat);
    sh.position.set(0, CH - 0.34, Z0 - 8 - s9 * 17);
    sh.rotation.z = (s9 % 2 ? 1 : -1) * 0.22;
    sh.rotation.x = Math.PI * 0.5 - 0.28;
    sh.renderOrder = 2;
    scene.add(sh);
  }

  /* ---- texture plumbing ------------------------------------------------ */
  var LOADER = new THREE.TextureLoader();
  W.pending = 0;
  function tex(url, onDone){
    W.pending++;
    var t = LOADER.load(url, function(){ W.pending--; if (onDone) onDone(); },
                        undefined, function(){ W.pending--; });
    t.minFilter = THREE.LinearFilter;         /* NPOT safe on WebGL1 */
    t.magFilter = THREE.LinearFilter;
    t.generateMipmaps = false;
    t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
    return t;
  }
  function artMat(map, int, tint){
    var m = mat(F_ART, {
      uMap:  { value: map }, uFog: { value: FOG },
      uInt:  { value: int === undefined ? 1 : int },
      uTint: { value: tint || new THREE.Color(1, 1, 1) }
    }, { additive: true, side: THREE.DoubleSide });
    W.artMats.push(m);
    return m;
  }
  W.artMat = artMat; W.tex = tex;

  function frameMat(int){
    var m = mat(F_FRAME, {
      uCol: { value: lightCol }, uFog: { value: FOG },
      uInt: { value: int === undefined ? 1 : int }
    }, { additive: true, side: THREE.DoubleSide });
    W.frameMats.push(m);
    return m;
  }

  /* Wall furniture keeps its landscape pose and a portrait pose; the
     portrait one steps inwards and turns towards the camera. */
  function mountWall(obj, side, z, y){
    var baseX = side * (CW - 0.06);
    var baseR = side < 0 ? Math.PI / 2 : -Math.PI / 2;
    obj.position.set(baseX, y || 0, z);
    obj.rotation.y = baseR;
    obj.userData.wall = { x: baseX, rot: baseR, side: side };
    W.wallMounted.push(obj);
    scene.add(obj);
    return obj;
  }
  W.mountWall = mountWall;

  /* ---- 6 · the wordmark, flown through at z = −52 ---------------------- */
  var markMat = artMat(tex('assets/wordmark.png'), 0);
  var mark = new THREE.Mesh(new THREE.PlaneGeometry(6.4, 2.15), markMat);
  mark.position.set(0, 0.1, -52); mark.renderOrder = 4;
  scene.add(mark);
  W.mark = mark; W.markMat = markMat;

  /* ---- 7 · three fragrance plaques ------------------------------------- */
  function noteCanvas(idx){
    var c = document.createElement('canvas');
    c.width = 640; c.height = 320;
    c.__draw = function(){
      var x = c.getContext('2d');
      x.clearRect(0, 0, 640, 320);
      x.textAlign = 'center';
      x.fillStyle = '#8d7f81';
      x.font = '400 22px Jost, Futura, Helvetica, Arial, sans-serif';
      var when = T('a4.w' + idx).toUpperCase(), sp = 6, w = 0, k;
      for (k = 0; k < when.length; k++) w += x.measureText(when[k]).width + sp;
      var cx = 320 - w / 2;
      for (k = 0; k < when.length; k++){
        x.fillText(when[k], cx + x.measureText(when[k]).width / 2, 96);
        cx += x.measureText(when[k]).width + sp;
      }
      x.fillStyle = '#ece4e2';
      x.font = 'italic 300 92px "Cormorant Garamond", Didot, Georgia, serif';
      x.fillText(T('a4.n' + idx), 320, 190);
      x.fillStyle = '#d6111c';
      x.fillRect(200, 232, 240, 2);
      if (c.__tex) c.__tex.needsUpdate = true;
    };
    c.__draw();
    W.canvasTex.push(c);
    var t = new THREE.CanvasTexture(c);
    t.minFilter = THREE.LinearFilter; t.magFilter = THREE.LinearFilter;
    t.generateMipmaps = false;
    c.__tex = t;
    return t;
  }
  W.plaques = [];
  [-74, -84, -94].forEach(function(z, n){
    var side = n % 2 === 0 ? -1 : 1;
    var g = new THREE.Group();
    var m = artMat(noteCanvas(n + 1), 0.15);
    var p = new THREE.Mesh(new THREE.PlaneGeometry(3.0, 1.5), m);
    p.renderOrder = 4; g.add(p);
    var lite = new THREE.Mesh(new THREE.PlaneGeometry(3.0, 0.22), frameMat(0.5));
    lite.position.y = -1.0; lite.renderOrder = 3; g.add(lite);
    mountWall(g, side, z, 0.35);
    W.plaques.push({ group: g, mat: m, idx: n });
  });

  /* ---- 8 · three posters ----------------------------------------------- */
  W.posters = [];
  [['assets/teaser-line.webp', -108, -1], ['assets/teaser-silhouette.webp', -118, 1], ['assets/teaser-engraving.webp', -128, -1]]
  .forEach(function(p){
    var g = new THREE.Group();
    var m = artMat(tex(p[0]), 1.0);
    var pic = new THREE.Mesh(new THREE.PlaneGeometry(2.05, 3.22), m);
    pic.renderOrder = 4; g.add(pic);
    var fr = new THREE.Mesh(new THREE.PlaneGeometry(2.28, 3.45), frameMat(0.6));
    fr.position.z = -0.01; fr.renderOrder = 3; g.add(fr);
    mountWall(g, p[2], p[1], 0.15);
    W.posters.push({ group: g, mat: m, frame: fr });
  });

  /* ---- 9 · the retail wall — confirmed partners only ------------------- */
  W.retailGroup = new THREE.Group();
  scene.add(W.retailGroup);
  W.retailPlaque = null;
  function retailCanvas(){
    var c = document.createElement('canvas');
    c.width = 640; c.height = 320;
    c.__draw = function(){
      var x = c.getContext('2d'), k, cx;
      x.clearRect(0, 0, 640, 320);
      x.textAlign = 'center';
      x.fillStyle = '#ece4e2';
      x.font = '300 56px "Cormorant Garamond", Didot, Georgia, serif';
      x.fillText(T('a6.sold'), 320, 130);
      x.fillStyle = '#d6111c'; x.fillRect(220, 162, 200, 2);
      if (confirmedRetail('shop').length === 0){
        x.fillStyle = '#8d7f81';
        x.font = '400 21px Jost, Futura, Helvetica, Arial, sans-serif';
        var words = T('a6.none').split(' '), line = '', lines = [];
        for (k = 0; k < words.length; k++){
          var test = line ? line + ' ' + words[k] : words[k];
          if (x.measureText(test).width > 540){ lines.push(line); line = words[k]; }
          else line = test;
        }
        lines.push(line);
        for (k = 0; k < lines.length; k++) x.fillText(lines[k], 320, 212 + k * 30);
      }
      if (c.__tex) c.__tex.needsUpdate = true;
    };
    c.__draw();
    W.canvasTex.push(c);
    var t = new THREE.CanvasTexture(c);
    t.minFilter = THREE.LinearFilter; t.magFilter = THREE.LinearFilter; t.generateMipmaps = false;
    c.__tex = t;
    return t;
  }
  var rpMat = artMat(retailCanvas(), 0.9);
  var rp = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 1.6), rpMat);
  rp.renderOrder = 4;
  var rpG = new THREE.Group(); rpG.add(rp);
  mountWall(rpG, 1, -140, 0.4);
  W.retailPlaque = { group: rpG, mat: rpMat };

  /* A partner's mark keeps its own colours on a light plate. The plate is
     drawn here rather than baked into the asset, so the same transparent
     file serves the DOM chip and the wall. */
  W.logoMats = [];
  function logoPlate(url, onSized){
    var c = document.createElement('canvas');
    c.width = 4; c.height = 4;
    var t = new THREE.CanvasTexture(c);
    t.minFilter = THREE.LinearFilter; t.magFilter = THREE.LinearFilter;
    t.generateMipmaps = false;
    t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;

    W.pending++;
    var img = new Image();
    img.decoding = 'async';
    img.onload = function(){
      var h = img.height || 150;
      var padX = Math.round(h * 0.55), padY = Math.round(h * 0.36);
      c.width  = img.width + padX * 2;
      c.height = h + padY * 2;
      var x = c.getContext('2d');
      var r = Math.round(c.height * 0.055);
      x.beginPath();
      x.moveTo(r, 0);
      x.lineTo(c.width - r, 0); x.quadraticCurveTo(c.width, 0, c.width, r);
      x.lineTo(c.width, c.height - r); x.quadraticCurveTo(c.width, c.height, c.width - r, c.height);
      x.lineTo(r, c.height); x.quadraticCurveTo(0, c.height, 0, c.height - r);
      x.lineTo(0, r); x.quadraticCurveTo(0, 0, r, 0);
      x.closePath();
      x.fillStyle = '#efeae8'; x.fill();
      x.drawImage(img, padX, padY);
      t.needsUpdate = true;
      W.pending--;
      if (onSized) onSized(c.width / c.height);
    };
    img.onerror = function(){ W.pending--; };
    img.src = url;
    return t;
  }

  W.buildRetailWall = function(){
    while (W.retailGroup.children.length){
      var ch = W.retailGroup.children.pop();
      var at = W.wallMounted.indexOf(ch);
      if (at >= 0) W.wallMounted.splice(at, 1);
      W.retailGroup.remove(ch);
    }
    W.logoMats.length = 0;
    var shops = confirmedRetail('shop').filter(function(r){ return has(r.logo); });
    shops.forEach(function(r, n){
      var g = new THREE.Group();
      var w = r.w || 2.0;
      var pl = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), null);
      var m = mat(F_LOGO, {
        uMap: { value: logoPlate(r.logo, function(aspect){
                  pl.scale.set(w, w / aspect, 1);
                }) },
        uFog: { value: FOG }, uInt: { value: 0.85 }
      }, { side: THREE.DoubleSide, depthWrite: true });
      m.transparent = true;
      pl.material = m;
      pl.scale.set(w, w * 0.4, 1);
      pl.renderOrder = 4;
      W.logoMats.push(m);
      g.add(pl);
      /* The brief hangs this on the right wall, but act VI's copy sits on the
         right as well and would cover it. The wall takes the free side; the
         "Erhältlich bei" plaque takes the covered one, where a label loses
         less by being half read than a partner's mark does. */
      g.position.set(-(CW - 0.06), 0.2, -138 - n * 3.6);
      g.rotation.y = Math.PI / 2;
      g.userData.wall = { x: -(CW - 0.06), rot: Math.PI / 2, side: -1, turn: 0.58 };
      W.wallMounted.push(g);
      W.retailGroup.add(g);
    });
  };
  W.buildRetailWall();

  return W;
}

/* --------------------------------------------------------------------------
   19 · THE FLACON — procedural, no model file
   The bevel is the whole point: it is what catches the red rim.
   -------------------------------------------------------------------------- */
function roundedRect(w, h, r, y0){
  var s = new THREE.Shape();
  var x0 = -w / 2, x1 = w / 2, ya = y0, yb = y0 + h;
  s.moveTo(x0 + r, ya);
  s.lineTo(x1 - r, ya); s.quadraticCurveTo(x1, ya, x1, ya + r);
  s.lineTo(x1, yb - r); s.quadraticCurveTo(x1, yb, x1 - r, yb);
  s.lineTo(x0 + r, yb); s.quadraticCurveTo(x0, yb, x0, yb - r);
  s.lineTo(x0, ya + r); s.quadraticCurveTo(x0, ya, x0 + r, ya);
  return s;
}

function engraveTexture(W){
  var c = document.createElement('canvas');
  c.width = 1024; c.height = 512;
  c.__draw = function(){
    var x = c.getContext('2d');
    x.clearRect(0, 0, 1024, 512);
    x.textAlign = 'center'; x.textBaseline = 'alphabetic';
    function spaced(txt, font, size, track, y, colour){
      x.font = font; x.fillStyle = colour;
      var w = 0, i;
      for (i = 0; i < txt.length; i++) w += x.measureText(txt[i]).width + track;
      w -= track;
      var cx = 512 - w / 2;
      for (i = 0; i < txt.length; i++){
        var cw = x.measureText(txt[i]).width;
        x.fillText(txt[i], cx + cw / 2, y);
        cx += cw + track;
      }
    }
    spaced('NOIRÉ', '300 190px "Cormorant Garamond", Didot, Georgia, serif', 190, 26, 260, '#ffd9d9');
    spaced('EAU DE PARFUM', '400 38px Jost, Futura, Helvetica, Arial, sans-serif', 38, 17, 350, '#e08b8b');
    if (c.__tex) c.__tex.needsUpdate = true;
  };
  c.__draw();
  W.canvasTex.push(c);
  var t = new THREE.CanvasTexture(c);
  t.minFilter = THREE.LinearFilter; t.magFilter = THREE.LinearFilter; t.generateMipmaps = false;
  c.__tex = t;
  return t;
}

function makeFlacon(W, fade, engTex){
  var side = fade > 0 ? THREE.DoubleSide : THREE.FrontSide;
  var glass = W.mat(F_GLASS, {
    uColA:  { value: W.lightCol },
    uColB:  { value: new THREE.Color().copy(COL.blood) },
    uRim:   { value: 1.0 }, uGlass: { value: 0.0 },
    uFog:   { value: FOG * 0.5 }, uFade: { value: fade },
    uLKey:  { value: new THREE.Vector3(0.34, 0.52, 0.78).normalize() },
    uLFill: { value: new THREE.Vector3(-0.72, 0.24, 0.65).normalize() }
  }, { side: side });

  var liquid = W.mat(F_LIQUID, {
    uCol:  { value: W.lightCol }, uFill: { value: 0.30 },
    uInt:  { value: 1.0 }, uFog: { value: FOG * 0.5 }, uFade: { value: fade }
  }, { additive: true, depthTest: false, side: THREE.DoubleSide });

  var eng = W.mat(F_ART, {
    uMap: { value: engTex }, uFog: { value: FOG * 0.5 },
    uInt: { value: 0.0 }, uTint: { value: new THREE.Color(1, 1, 1) }
  }, { additive: true, side: THREE.DoubleSide });

  var g = new THREE.Group();

  /* body */
  var body = new THREE.ExtrudeGeometry(roundedRect(1.34, 1.86, 0.13, -1.105), {
    depth: 0.52, bevelEnabled: true, bevelThickness: 0.055, bevelSize: 0.055,
    bevelSegments: 5, curveSegments: 14, steps: 1
  });
  body.translate(0, 0, -0.26);
  body.computeVertexNormals();
  g.add(new THREE.Mesh(body, glass));

  /* shoulder, neck, three collar rings */
  var sh = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.46, 0.2, 26), glass);
  sh.position.y = 0.87; g.add(sh);
  var nk = new THREE.Mesh(new THREE.CylinderGeometry(0.185, 0.2, 0.3, 26), glass);
  nk.position.y = 1.02; g.add(nk);
  for (var n = 0; n < 3; n++){
    var tr = new THREE.Mesh(new THREE.TorusGeometry(0.19, 0.032, 8, 26), glass);
    tr.rotation.x = Math.PI / 2; tr.position.y = 0.99 + n * 0.088;
    g.add(tr);
  }

  /* stopper — its own group so it can lift later */
  var cap = new THREE.Group();
  var body8 = new THREE.Mesh(new THREE.CylinderGeometry(0.44, 0.47, 0.42, 8), glass);
  body8.position.y = 1.38; cap.add(body8);
  var plate = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.44, 0.04, 8), glass);
  plate.position.y = 1.605; cap.add(plate);
  g.add(cap);

  /* what is in it */
  var liq = new THREE.ExtrudeGeometry(roundedRect(1.16, 1.66, 0.11, -1.045), {
    depth: 0.36, bevelEnabled: false, curveSegments: 12, steps: 1
  });
  liq.translate(0, 0, -0.18);
  liq.computeVertexNormals();
  var liqM = new THREE.Mesh(liq, liquid);
  liqM.renderOrder = 4;
  g.add(liqM);

  /* the name, cut in rather than printed on */
  var engM = new THREE.Mesh(new THREE.PlaneGeometry(1.02, 0.51), eng);
  engM.position.set(0, -0.06, 0.272);   /* just proud of the flat face at 0.26 */
  engM.renderOrder = 5;
  g.add(engM);

  return { group: g, cap: cap, glass: glass, liquid: liquid, eng: eng };
}

/* --------------------------------------------------------------------------
   20 · THE HALL
   -------------------------------------------------------------------------- */
function buildHall(W){
  var scene = W.scene, S = FLACON_S;
  var engTex = engraveTexture(W);

  W.flacon = makeFlacon(W, 0.0, engTex);
  W.flacon.group.position.set(0, FLOOR_Y + 1.105 * S, FLACON_Z);
  W.flacon.group.scale.setScalar(S);
  scene.add(W.flacon.group);

  W.mirror = makeFlacon(W, 1.0, engTex);
  W.mirror.group.position.set(0, 2 * FLOOR_Y - (FLOOR_Y + 1.105 * S), FLACON_Z);
  W.mirror.group.scale.set(S, -S, S);
  scene.add(W.mirror.group);

  /* the shaft of light behind it — two crossed planes */
  W.columnMat = W.mat(F_COLUMN, {
    uCol:  { value: W.lightCol }, uTime: { value: 0 },
    uInt:  { value: 1.0 }, uFog: { value: FOG * 0.4 }
  }, { additive: true, side: THREE.DoubleSide });
  var colGeo = new THREE.PlaneGeometry(9, 34, 1, 24);
  [0, Math.PI / 2].forEach(function(rot){
    var c = new THREE.Mesh(colGeo, W.columnMat);
    c.position.set(0, FLOOR_Y + 16.4, FLACON_Z - 6.5);
    c.rotation.y = rot; c.renderOrder = 1;
    scene.add(c);
  });

  /* and the pool it stands in */
  W.poolMat = W.mat(F_POOL, {
    uCol: { value: W.lightCol }, uInt: { value: 1.0 },
    uFog: { value: FOG * 0.5 }, uTime: { value: 0 }
  }, { additive: true, side: THREE.DoubleSide });
  var pool = new THREE.Mesh(new THREE.PlaneGeometry(46, 46), W.poolMat);
  pool.rotation.x = -Math.PI / 2;
  pool.position.set(0, FLOOR_Y + 0.02, FLACON_Z);
  pool.renderOrder = 1;
  scene.add(pool);

  /* ---- dust: it never moves, the parallax is the flight ---------------- */
  var MOBILE = Math.min(window.innerWidth, window.innerHeight) < 760 ||
               /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  var N = MOBILE ? 500 : 1500;
  var pos = new Float32Array(N * 3), seed = new Float32Array(N);
  for (var i = 0; i < N; i++){
    pos[i*3]     = (Math.random() * 2 - 1) * (CW - 0.25);
    pos[i*3 + 1] = (Math.random() * 2 - 1) * (CH - 0.2);
    pos[i*3 + 2] = Z0 - Math.random() * (Z0 - HALL_END);
    seed[i] = Math.random();
  }
  var dg = new THREE.BufferGeometry();
  dg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  dg.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
  dg.setDrawRange(0, N);
  W.dustMat = new THREE.ShaderMaterial({
    vertexShader: V_DUST, fragmentShader: F_DUST,
    uniforms: {
      uCol:  { value: W.lightCol }, uFog: { value: FOG * 0.8 },
      uInt:  { value: 1.0 }, uSize: { value: 1.0 },
      uPix:  { value: 1.0 }
    },
    transparent: true, blending: THREE.AdditiveBlending,
    depthWrite: false, fog: false
  });
  W.dust = new THREE.Points(dg, W.dustMat);
  W.dust.renderOrder = 1;
  W.dustCount = N;
  scene.add(W.dust);

  /* language switch redraws every canvas texture in the room */
  window.__noireRelabel = function(){
    W.canvasTex.forEach(function(c){ if (c.__draw) c.__draw(); });
    if (W.buildRetailWall) W.buildRetailWall();
  };
  return W;
}

/* --------------------------------------------------------------------------
   21 · POST — hand built. r128 ships no EffectComposer.
   scene → bright pass → bloom (¼) → anamorphic streak (⅛) → composite
   -------------------------------------------------------------------------- */
var FS_VERT = [
'varying vec2 vUv;',
'void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }'
].join('\n');

var FS_BRIGHT = [
'precision highp float;',
'uniform sampler2D uTex; uniform float uThr; uniform float uSoft;',
'varying vec2 vUv;',
'void main(){',
'  vec3 c = texture2D(uTex, vUv).rgb;',
'  float l = max(c.r, max(c.g, c.b));',
'  float k = smoothstep(uThr, uThr + uSoft, l);',
'  gl_FragColor = vec4(c * k, 1.0);',
'}'
].join('\n');

var FS_BLUR = [
'precision highp float;',
'uniform sampler2D uTex; uniform vec2 uDir; uniform vec2 uTexel; uniform float uStep;',
'varying vec2 vUv;',
'void main(){',
'  vec2 o = uDir * uTexel * uStep;',
'  vec3 c = texture2D(uTex, vUv).rgb * 0.2270270;',
'  c += texture2D(uTex, vUv + o * 1.0).rgb * 0.1945946;',
'  c += texture2D(uTex, vUv - o * 1.0).rgb * 0.1945946;',
'  c += texture2D(uTex, vUv + o * 2.0).rgb * 0.1216216;',
'  c += texture2D(uTex, vUv - o * 2.0).rgb * 0.1216216;',
'  c += texture2D(uTex, vUv + o * 3.0).rgb * 0.0540540;',
'  c += texture2D(uTex, vUv - o * 3.0).rgb * 0.0540540;',
'  c += texture2D(uTex, vUv + o * 4.0).rgb * 0.0162162;',
'  c += texture2D(uTex, vUv - o * 4.0).rgb * 0.0162162;',
'  gl_FragColor = vec4(c, 1.0);',
'}'
].join('\n');

var FS_COMP = [
'precision highp float;',
'uniform sampler2D uScene; uniform sampler2D uBloom; uniform sampler2D uStreak;',
'uniform float uStr; uniform float uFlare; uniform float uSpeed; uniform float uVig;',
'uniform float uTime; uniform vec2 uRes; uniform float uGrain;',
'varying vec2 vUv;',
'float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }',
'void main(){',
'  vec2 d = vUv - 0.5;',
'  float r2 = dot(d, d);',
'  vec2 ab = d * r2 * (0.030 + uSpeed * 0.14);',
'  vec3 c;',
'  c.r = texture2D(uScene, vUv + ab).r;',
'  c.g = texture2D(uScene, vUv).g;',
'  c.b = texture2D(uScene, vUv - ab).b;',
'  if (uSpeed > 0.001){',
'    vec3 sm = vec3(0.0);',
'    for (int i = 1; i <= 4; i++){',
'      sm += texture2D(uScene, vUv - d * (float(i) / 4.0) * uSpeed * 0.16).rgb;',
'    }',
'    c = mix(c, sm * 0.25, clamp(uSpeed * 0.55, 0.0, 0.55));',
'  }',
'  c += texture2D(uBloom,  vUv).rgb * uStr   * vec3(1.05, 0.93, 0.95);',
'  c += texture2D(uStreak, vUv).rgb * uFlare * vec3(1.00, 0.20, 0.26);',
'  c = c / (1.0 + c * 0.32);',
'  c *= 1.0 - smoothstep(0.30, 1.30, length(d) * 1.42) * uVig;',
'  c += (hash(vUv * uRes + uTime * 60.0) - 0.5) * uGrain;',
'  gl_FragColor = vec4(c, 1.0);',
'}'
].join('\n');

/* --------------------------------------------------------------------------
   22 · CAMERA FLIGHT
   -------------------------------------------------------------------------- */
var K = {
  z: [[0,24],[1,-4],[2,-34],[3,-62],[4,-98],[5,-132],[6,-150],[6.6,-158],[7,-163],[7.45,-161],[8,-155]],
  x: [[0,0],[1,0.2],[2,-0.9],[3,0.9],[3.6,-1],[4.3,1.1],[5,-1.2],[5.7,1.3],[6.3,0.6],[6.8,-3.4],[7.3,1.6],[7.7,-2.2],[8,0.9]],
  y: [[0,0.1],[2,-0.15],[3,0.25],[4,-0.2],[5,0.3],[6,0.1],[6.6,0.9],[7.2,-0.4],[8,0.6]],
  wall:   [[0,0.5],[1,1],[4,1.15],[6,0.9],[8,0.7]],
  ring:   [[0,0.35],[0.6,1.25],[3,1],[5,1.1],[6,0.7],[8,0.4]],
  portal: [[5,1.6],[5.9,4.2],[6.4,2.2],[8,1.2]],
  mark:   [[1.2,0],[1.9,1],[2.55,1],[2.9,0]],
  markS:  [[1.2,0.86],[2.9,1.14]],
  frame:  [[4,0.6],[5,1.5],[5.8,1.5],[6.4,0.5]],
  spin:   [[5.5,-0.5],[6.4,0.1],[7,0.75],[8,1.9]],
  lift:   [[6.9,0],[7.35,0.2],[7.7,0.2],[8,0.05]],
  eng:    [[6.4,0],[7.1,0.95],[8,0.8]],
  glass:  [[5.8,0],[6.8,1]],
  bloom:  [[0,1],[1,1.25],[3,1.35],[5,1.3],[6.2,1.6],[7.2,1.35],[8,1.2]],
  flare:  [[0,0.35],[1,0.7],[3,0.6],[5.6,0.55],[6.3,1.15],[7,0.8],[8,0.65]],
  scope:  [[0,0],[0.2,1],[1.8,1],[2.2,0],[6,0],[6.5,1],[7.4,1],[7.8,0]]
};

/* --------------------------------------------------------------------------
   23 · RENDERER, LOOP, QUALITY
   -------------------------------------------------------------------------- */
function startGL(){
  var canvas = $('#gl');
  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: false, alpha: false,
                                         powerPreference: 'high-performance', stencil: false, depth: true });
  } catch (e) { return null; }

  var isWebGL2 = !!(renderer.capabilities && renderer.capabilities.isWebGL2);
  var gl = renderer.getContext();
  var canFloat = isWebGL2 && !!gl.getExtension('EXT_color_buffer_float');
  var RT_TYPE = canFloat ? THREE.HalfFloatType : THREE.UnsignedByteType;

  var MOBILE = Math.min(window.innerWidth, window.innerHeight) < 760 ||
               /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  var DPR_CAP = MOBILE ? 1.3 : 1.55;

  renderer.setClearColor(0x050203, 1);
  renderer.autoClear = true;

  var W = buildWorld();
  buildHall(W);
  var scene = W.scene;

  var cam = new THREE.PerspectiveCamera(54, 1, 0.1, 320);
  cam.position.set(0, 0.1, 24);

  /* full screen quad shared by every pass */
  var fsScene = new THREE.Scene();
  var fsCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  var fsQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), null);
  fsQuad.frustumCulled = false;
  fsScene.add(fsQuad);

  function pass(frag, uni){
    return new THREE.ShaderMaterial({ vertexShader: FS_VERT, fragmentShader: frag,
                                      uniforms: uni, depthTest: false, depthWrite: false });
  }
  var mBright = pass(FS_BRIGHT, { uTex:{value:null}, uThr:{value:0.36}, uSoft:{value:0.26} });
  var mBlur   = pass(FS_BLUR,   { uTex:{value:null}, uDir:{value:new THREE.Vector2(1,0)},
                                  uTexel:{value:new THREE.Vector2(1,1)}, uStep:{value:1} });
  var mComp   = pass(FS_COMP,   {
    uScene:{value:null}, uBloom:{value:null}, uStreak:{value:null},
    uStr:{value:1}, uFlare:{value:0.35}, uSpeed:{value:0}, uVig:{value:0.85},
    uTime:{value:0}, uRes:{value:new THREE.Vector2(1,1)}, uGrain:{value:0.030}
  });

  function makeRT(w, h){
    return new THREE.WebGLRenderTarget(Math.max(2, w | 0), Math.max(2, h | 0), {
      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
      format: THREE.RGBAFormat, type: RT_TYPE, depthBuffer: true, stencilBuffer: false
    });
  }
  var rtScene = makeRT(2, 2), rtBright = makeRT(2, 2),
      rtBloomA = makeRT(2, 2), rtBloomB = makeRT(2, 2),
      rtStreakA = makeRT(2, 2), rtStreakB = makeRT(2, 2);
  var black = new THREE.DataTexture(new Uint8Array([0,0,0,255]), 1, 1, THREE.RGBAFormat);
  black.needsUpdate = true;

  /* ---- quality ladder ------------------------------------------------- */
  var Q = { level: 3, times: [], idx: 0, cool: 0, ups: 0 };
  var qDPR = 1, qBloomPasses = 2, qStreak = true, qParticles = 1;
  function applyQuality(){
    var l = Q.level;
    qStreak       = l >= 2;
    qBloomPasses  = l >= 2 ? 2 : 1;
    qDPR          = l >= 2 ? 1 : (l === 1 ? 0.85 : 0.85 * 0.7);
    qParticles    = l >= 2 ? 1 : (l === 1 ? 0.5 : 0.25);
    W.dust.geometry.setDrawRange(0, Math.max(60, Math.round(W.dustCount * qParticles)));
    resize();
  }

  var VW = 1, VH = 1, PIX = 1;
  function resize(){
    var w = window.innerWidth, h = window.innerHeight;
    PIX = Math.min(window.devicePixelRatio || 1, DPR_CAP) * qDPR;
    renderer.setPixelRatio(1);
    renderer.setSize(w, h, false);
    VW = Math.max(2, Math.round(w * PIX));
    VH = Math.max(2, Math.round(h * PIX));
    canvas.width = VW; canvas.height = VH;
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    renderer.setViewport(0, 0, VW, VH);

    rtScene.setSize(VW, VH);
    rtBright.setSize(VW >> 2, VH >> 2);
    rtBloomA.setSize(VW >> 2, VH >> 2);
    rtBloomB.setSize(VW >> 2, VH >> 2);
    rtStreakA.setSize(VW >> 3, VH >> 3);
    rtStreakB.setSize(VW >> 3, VH >> 3);

    var aspect = w / h;
    cam.aspect = aspect;
    cam.fov = aspect >= 1 ? 54 : Math.min(76, 54 + (1 - aspect) * 40);
    cam.updateProjectionMatrix();
    mComp.uniforms.uRes.value.set(VW, VH);
    W.dustMat.uniforms.uPix.value = PIX;
    applyPortrait(aspect);
    if (HAS_GSAP) ScrollTrigger.refresh();
  }

  /* ---- portrait: you must still see the walls -------------------------- */
  function applyPortrait(aspect){
    var portrait = aspect < 1;
    W.wallMounted.forEach(function(o){
      var wd = o.userData.wall;
      if (!wd) return;
      var turn = wd.turn === undefined ? 1 : wd.turn;
      o.position.x = portrait ? wd.x - wd.side * 1.15 : wd.x;
      o.rotation.y = wd.rot * (portrait ? Math.min(0.62, turn) : turn);
      o.scale.setScalar(portrait ? 0.92 : 1);
    });
    W.mark.scale.setScalar(portrait ? 0.72 : 1);
    W.__portrait = portrait;
  }

  /* ---- flight state ---------------------------------------------------- */
  var mouse = { x: 0, y: 0, tx: 0, ty: 0 };
  window.addEventListener('pointermove', function(e){
    mouse.tx = (e.clientX / window.innerWidth - 0.5) * 2;
    mouse.ty = (e.clientY / window.innerHeight - 0.5) * 2;
  }, { passive: true });

  var look = new THREE.Vector3();
  var lookCorridor = new THREE.Vector3();
  var lookFlacon = new THREE.Vector3(0, 2.0, FLACON_Z);
  var prevZ = 24, speed = 0, speedS = 0;
  var t0 = performance.now();
  var clock = 0;

  function frame(now){
    requestAnimationFrame(frame);
    var dt = Math.min(0.05, (now - t0) / 1000) || 0.016;
    t0 = now;
    clock += dt;

    if (!HAS_GSAP) measureManual();
    manualReveals();

    var g = clamp(G, 0, 8);
    var still = HTML.classList.contains('still');

    /* ---- position ---- */
    var cz = curve(K.z, g);
    var cx = curve(K.x, g) * (W.__portrait ? 0.45 : 1);
    var cy = curve(K.y, g);

    var t = clock;
    var shakeX = still ? 0 : (Math.sin(t * 0.31) * 0.14 + Math.sin(t * 0.77) * 0.05);
    var shakeY = still ? 0 : Math.sin(t * 0.44) * 0.07;
    var roll   = still ? 0 : (Math.sin(t * 0.23) * 0.011 - Math.cos(t * 0.31) * 0.022);

    mouse.x += (mouse.tx - mouse.x) * 0.04;
    mouse.y += (mouse.ty - mouse.y) * 0.04;
    var mx = still ? 0 : mouse.x * 0.5;

    cam.position.set(cx + shakeX + mx, cy + shakeY, cz);

    /* ---- aim ---- */
    lookCorridor.set(cx * 0.35, cy * 0.4, cz - 34);
    var toFlacon = smoothstep(6.1, 6.9, g);
    look.copy(lookCorridor).lerp(lookFlacon, toFlacon);
    cam.lookAt(look);
    cam.rotation.z += roll;

    /* ---- speed drives blur, aberration, dust size and the drive tone ---- */
    var raw = Math.abs(cz - prevZ) / Math.max(0.001, dt);
    prevZ = cz;
    speed = clamp(raw / 90, 0, 1);
    speedS += (speed - speedS) * 0.08;
    var spdOut = still ? 0 : speedS;

    /* ---- world colour follows the pyramid ---- */
    worldColour(g, W.lightCol);

    /* ---- g driven uniforms ---- */
    var wallI = curve(K.wall, g);
    W.wallMats.forEach(function(m){
      m.uniforms.uInt.value = m.__baseInt * wallI;
      m.uniforms.uTime.value = clock;
    });
    W.ringMats.forEach(function(m){
      m.uniforms.uInt.value = curve(K.ring, g) * EX.ring;
      m.uniforms.uTime.value = clock;
    });
    W.portalMat.uniforms.uInt.value = curve(K.portal, g) * EX.ring;
    W.portalMat.uniforms.uTime.value = clock;
    W.stripMat.uniforms.uTime.value = clock;
    W.stripMat.uniforms.uInt.value = curve(K.ring, g) * EX.strip;
    W.frameMats.forEach(function(m){ m.uniforms.uInt.value = curve(K.frame, g) * EX.frame; });
    W.logoMats.forEach(function(m){ m.uniforms.uInt.value = 0.30 + smoothstep(5.0, 5.9, g) * 0.62; });

    W.markMat.uniforms.uInt.value = curve(K.mark, g) * 1.25;
    W.mark.scale.setScalar((W.__portrait ? 0.72 : 1) * curve(K.markS, g));

    W.plaques.forEach(function(p){
      var lit = smoothstep(-70 - p.idx * 10, -78 - p.idx * 10, cz);
      p.mat.uniforms.uInt.value = (0.15 + lit * 1.25) * EX.art;
    });
    W.posters.forEach(function(p){ p.mat.uniforms.uInt.value = 1.5 + curve(K.frame, g) * 0.9; });

    W.columnMat.uniforms.uTime.value = clock;
    W.columnMat.uniforms.uInt.value = (0.35 + smoothstep(5.4, 6.6, g) * 1.15) * EX.column;
    W.poolMat.uniforms.uTime.value = clock;
    W.poolMat.uniforms.uInt.value = (0.4 + smoothstep(5.6, 6.8, g) * 1.0) * EX.pool;
    W.dustMat.uniforms.uSize.value = 1.0 + spdOut * 2.2;
    W.dustMat.uniforms.uInt.value = (0.55 + spdOut * 0.5) * EX.dust;

    /* ---- the flacon ---- */
    var spin = curve(K.spin, g), lift = curve(K.lift, g),
        engI = curve(K.eng, g), glassI = curve(K.glass, g);
    [W.flacon, W.mirror].forEach(function(f){
      f.group.rotation.y = spin;
      f.cap.position.y = lift;
      f.glass.uniforms.uGlass.value = glassI * EX.glass;
      f.glass.uniforms.uRim.value = (0.85 + glassI * 0.5) * EX.rim;
      f.eng.uniforms.uInt.value = engI * 1.7;
      f.liquid.uniforms.uInt.value = (0.5 + glassI * 0.9) * EX.liquid;
    });

    /* ---- chrome ---- */
    var scope = still ? 0 : curve(K.scope, g);
    $('#bars').style.setProperty('--scope', scope.toFixed(3));
    paintHUD();

    /* ---- draw ---- */
    mComp.uniforms.uStr.value = curve(K.bloom, g) * EX.bloom;
    mComp.uniforms.uFlare.value = qStreak ? curve(K.flare, g) * EX.flare : 0;
    mComp.uniforms.uSpeed.value = spdOut;
    mComp.uniforms.uTime.value = clock;

    renderer.setRenderTarget(rtScene);
    renderer.clear();
    renderer.render(scene, cam);

    fsQuad.material = mBright;
    mBright.uniforms.uTex.value = rtScene.texture;
    renderer.setRenderTarget(rtBright);
    renderer.render(fsScene, fsCam);

    fsQuad.material = mBlur;
    var bw = Math.max(2, VW >> 2), bh = Math.max(2, VH >> 2);
    mBlur.uniforms.uTexel.value.set(1 / bw, 1 / bh);
    var src = rtBright;
    for (var b = 0; b < qBloomPasses; b++){
      var step = b === 0 ? 1 : 2;
      mBlur.uniforms.uStep.value = step;
      mBlur.uniforms.uDir.value.set(1, 0);
      mBlur.uniforms.uTex.value = src.texture;
      renderer.setRenderTarget(rtBloomA);
      renderer.render(fsScene, fsCam);
      mBlur.uniforms.uDir.value.set(0, 1);
      mBlur.uniforms.uTex.value = rtBloomA.texture;
      renderer.setRenderTarget(rtBloomB);
      renderer.render(fsScene, fsCam);
      src = rtBloomB;
    }
    var bloomTex = src.texture;

    var streakTex = black;
    if (qStreak){
      var sw = Math.max(2, VW >> 3), sh = Math.max(2, VH >> 3);
      mBlur.uniforms.uTexel.value.set(1 / sw, 1 / sh);
      mBlur.uniforms.uDir.value.set(1, 0);
      var ssrc = rtBright, dstA = rtStreakA, dstB = rtStreakB, steps = [2, 6, 15];
      for (var s = 0; s < 3; s++){
        mBlur.uniforms.uStep.value = steps[s];
        mBlur.uniforms.uTex.value = ssrc.texture;
        renderer.setRenderTarget(dstA);
        renderer.render(fsScene, fsCam);
        ssrc = dstA;
        var swap = dstA; dstA = dstB; dstB = swap;
      }
      streakTex = ssrc.texture;
    }

    fsQuad.material = mComp;
    mComp.uniforms.uScene.value = rtScene.texture;
    mComp.uniforms.uBloom.value = bloomTex;
    mComp.uniforms.uStreak.value = streakTex;
    renderer.setRenderTarget(null);
    renderer.render(fsScene, fsCam);

    /* ---- audio follows the flight ---- */
    audioTick(g, spdOut);

    /* ---- quality: average 45 frames, then step, with a cool down ---- */
    Q.times.push(dt * 1000);
    if (Q.times.length >= 45){
      var sum = 0;
      for (var q = 0; q < Q.times.length; q++) sum += Q.times[q];
      var avg = sum / Q.times.length;
      Q.times.length = 0;
      if (Q.cool > 0) Q.cool -= 45;
      else if (avg > 26 && Q.level > 0){ Q.level--; Q.cool = 150; applyQuality(); }
      else if (avg < 15.5 && Q.level < 3 && Q.ups < 2){ Q.level++; Q.ups++; Q.cool = 300; applyQuality(); }
    }
  }

  window.addEventListener('resize', resize, { passive: true });
  window.addEventListener('orientationchange', function(){ setTimeout(resize, 220); });
  applyQuality();
  resize();
  requestAnimationFrame(frame);
  GL = { renderer: renderer, world: W, camera: cam };
  return GL;
}

/* --------------------------------------------------------------------------
   24 · SOUND — synthetic, off by default, context only on a real click
   -------------------------------------------------------------------------- */
var AC = null, AUD = null;
function buildAudio(){
  var Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return null;
  var ac = new Ctx();
  var out = ac.createGain(); out.gain.value = 0; out.connect(ac.destination);

  /* drone: two sines a fraction apart, a triangle an octave up */
  var lp = ac.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 240; lp.Q.value = 3;
  lp.connect(out);
  var droneGain = ac.createGain(); droneGain.gain.value = 0.5; droneGain.connect(lp);
  [[42, 'sine', 1], [42.6, 'sine', 0.9], [84.2, 'triangle', 0.28]].forEach(function(o){
    var osc = ac.createOscillator(); osc.type = o[1]; osc.frequency.value = o[0];
    var g = ac.createGain(); g.gain.value = o[2];
    osc.connect(g); g.connect(droneGain); osc.start();
  });
  var lfo = ac.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 0.07;
  var lfoG = ac.createGain(); lfoG.gain.value = 60;
  lfo.connect(lfoG); lfoG.connect(lp.frequency); lfo.start();

  /* drive: a looping noise bed through a band pass */
  var len = Math.floor(ac.sampleRate * 2);
  var buf = ac.createBuffer(1, len, ac.sampleRate);
  var ch = buf.getChannelData(0);
  for (var i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * 0.5;
  var noise = ac.createBufferSource(); noise.buffer = buf; noise.loop = true;
  var bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 700; bp.Q.value = 0.9;
  var driveGain = ac.createGain(); driveGain.gain.value = 0;
  noise.connect(bp); bp.connect(driveGain); driveGain.connect(out);
  noise.start();

  return { ac: ac, out: out, drive: driveGain, driveF: bp, noiseBuf: buf,
           armPortal: true, armSpray: true };
}
function toggleSound(){
  if (!AUD){
    AUD = buildAudio();
    if (!AUD){ $('#tSound').setAttribute('aria-pressed', 'false'); return; }
    AC = AUD.ac;
  }
  if (AC.state === 'suspended') AC.resume();
  SOUND = !SOUND;
  $('#tSound').setAttribute('aria-pressed', String(SOUND));
  AUD.out.gain.setTargetAtTime(SOUND ? 0.22 : 0, AC.currentTime, 0.4);
}
function boom(){
  var ac = AUD.ac, t = ac.currentTime;
  var o = ac.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(120, t);
  o.frequency.exponentialRampToValueAtTime(28, t + 1.5);
  var g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.9, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 2.2);
  o.connect(g); g.connect(AUD.out);
  o.start(t); o.stop(t + 2.3);
}
function spray(){
  var ac = AUD.ac, t = ac.currentTime;
  var s = ac.createBufferSource(); s.buffer = AUD.noiseBuf; s.loop = true;
  var hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2200;
  var g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.5, t + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
  s.connect(hp); hp.connect(g); g.connect(AUD.out);
  s.start(t); s.stop(t + 0.55);
}
function audioTick(g, spd){
  if (!AUD || !SOUND) return;
  var t = AUD.ac.currentTime;
  AUD.drive.gain.setTargetAtTime(spd * 0.30, t, 0.12);
  AUD.driveF.frequency.setTargetAtTime(430 + spd * 1500, t, 0.18);
  if (g > 5.92){ if (AUD.armPortal){ AUD.armPortal = false; boom(); } }
  else AUD.armPortal = true;
  if (g > 7.05){ if (AUD.armSpray){ AUD.armSpray = false; spray(); } }
  else AUD.armSpray = true;
}

/* --------------------------------------------------------------------------
   25 · BOOT
   The loading screen is injected here on purpose: without JavaScript nobody
   should be staring at a black plate that hides the whole page.
   -------------------------------------------------------------------------- */
function showLoader(){
  var d = document.createElement('div');
  d.className = 'load'; d.id = 'load'; d.setAttribute('aria-hidden', 'true');
  d.innerHTML = '<i></i><span>' + esc(T('gate')) + '</span>';
  document.body.appendChild(d);
  return d;
}
function hideLoader(el){
  if (!el) return;
  el.style.setProperty('--l', 1);
  el.classList.add('done');
  setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 900);
}

(function boot(){
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  applyI18n();
  wireChrome();
  if (reduce) setMotion(false); else setMotion(true);

  buildReveals();
  buildScrubs();
  BOOTED = true;
  measureManual();
  paintHUD();

  setInterval(tickCountdown, 1000);
  setInterval(function(){ paintPrice(); paintJSONLD(); }, 60000);

  var ok = detectWebGL() && !!window.THREE;
  if (ok){
    HTML.classList.add('gl');
    var loader = showLoader();
    var started = null;
    try { started = startGL(); }
    catch (e){ HTML.classList.remove('gl'); hideLoader(loader); started = null; }
    if (started){
      var t0 = Date.now(), iv = setInterval(function(){
        var W = started.world;
        var done = (W.pending <= 0) || (Date.now() - t0 > 6000);
        var el = document.getElementById('load');
        if (el) el.style.setProperty('--l', String(clamp((Date.now() - t0) / 2200, 0.05, 1)));
        if (done){ clearInterval(iv); hideLoader(el); }
      }, 120);
    }
  } else {
    /* no WebGL: still drive --p, the depth meter and the reveals */
    (function tick(){
      requestAnimationFrame(tick);
      if (!HAS_GSAP) measureManual();
      manualReveals();
      paintHUD();
    })();
  }

  if (document.fonts && document.fonts.ready){
    document.fonts.ready.then(function(){
      if (window.__noireRelabel) window.__noireRelabel();
      if (HAS_GSAP) ScrollTrigger.refresh();
    });
  }
})();
</script>
