<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Heldenzeit – Uptempo (Out now)</title>
<style>
  /* Two faces: Bodoni Moda (display: roman for credits, italic for the title, as on the cover) and Inter (UI). */
  @font-face { font-family: Display; src: url(../heldenzeit-teaser/fonts/display.ttf) format('truetype'); font-weight: 100 900; }
  @font-face { font-family: DisplayI; src: url(../heldenzeit-teaser/fonts/display-italic.ttf) format('truetype'); font-weight: 100 900; }
  @font-face { font-family: UI; src: url(../heldenzeit-teaser/fonts/ui-medium.otf) format('opentype'); font-weight: 400 549; }
  @font-face { font-family: UI; src: url(../heldenzeit-teaser/fonts/ui-semibold.otf) format('opentype'); font-weight: 550 900; }
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  body { display: grid; place-items: center; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; width: auto; height: auto; }
  #hud { position: fixed; left: 12px; bottom: 10px; font: 12px/1 ui-monospace, monospace; color: #888; }
  .render #hud { display: none; }
</style>
</head>
<body>
<canvas id="film"></canvas>
<div id="hud">space: play/pause · ←/→: step · click: scrub · ?format=9x16 to preview other formats</div>
<script type="module" src="film.js"></script>
</body>
</html>
